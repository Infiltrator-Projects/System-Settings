name: apply-brittleness-top3-refactor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/brittleness-top3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brittleness-top3
          fetch-depth: 0

      - name: Apply bounded refactor script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/refactor-brittleness-top3.yml').read_text()
          start_marker = '      - name: Apply bounded architectural cleanup\n'
          step_start = workflow.index(start_marker)
          run_start = workflow.index('        run: |\n', step_start) + len('        run: |\n')
          end_marker = '      - name: Commit refactor result\n'
          run_end = workflow.index(end_marker, run_start)
          script = textwrap.dedent(workflow[run_start:run_end])
          script = script.replace(
              'shell = replace_once(shell, host_block, provider_block, "home provider ownership")',
              'shell = replace_once(shell, "    root = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\\n", provider_block[len(host_block):] + "    root = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 0);\\n", "home provider ownership")')
          exec(compile(script, 'refactor-brittleness-top3', 'exec'), {'__name__': '__main__'})

      - name: Commit refactor result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refactor-brittleness-top3.yml
          rm .github/workflows/refactor-brittleness-top3-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish top-three coupling cleanup"
          git push origin HEAD:fix/brittleness-top3
