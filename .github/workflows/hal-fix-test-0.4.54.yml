# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL fix lazy-panel regression test

on:
  push:
    branches: ["hal/system-settings-forensic-0.4.54-clean"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/system-settings-forensic-0.4.54-clean
          fetch-depth: 0
          submodules: false
      - shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ensure_date_time_panel(runtime_search_state);' tests/linux-shell-test.c; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/linux-shell-test.c')
          t = p.read_text()
          pattern = re.compile(
              r'        gtk_list_box_select_row\(\n'
              r'            runtime_search_state->list,\n'
              r'            runtime_search_state->date_row\);\n'
              r'        while \(g_main_context_iteration\(NULL, FALSE\)\) \{\n'
              r'        \}\n'
              r'        SsLinuxDateTimePanel \*panel = g_object_get_data\(')
          t, n = pattern.subn(
              '        ensure_date_time_panel(runtime_search_state);\n'
              '        SsLinuxDateTimePanel *panel = g_object_get_data(', t, count=1)
          if n != 1:
              raise SystemExit(f'lazy construction block mismatch: {n}')
          pattern = re.compile(
              r'        gtk_list_box_select_row\(\n'
              r'            navigation, runtime_search_state->home_row\);\n'
              r'        while \(g_main_context_iteration\(NULL, FALSE\)\) \{\n'
              r'        \}\n'
              r'        if \(i == 0\) \{')
          t, n = pattern.subn('        if (i == 0) {', t, count=1)
          if n != 1:
              raise SystemExit(f'redundant home-selection block mismatch: {n}')
          p.write_text(t)
          PY
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add tests/linux-shell-test.c
          git commit -m "Make lazy Date and Time shell regression deterministic"
          git push origin HEAD:hal/system-settings-forensic-0.4.54-clean
