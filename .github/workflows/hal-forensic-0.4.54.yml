name: HAL forensic 0.4.54 apply

on:
  push:
    branches: ["hal/system-settings-forensic-0.4.54"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/system-settings-forensic-0.4.54
          fetch-depth: 0
          submodules: false
      - name: Apply forensic cleanup
        shell: bash
        run: |
          set -euo pipefail
          if grep -qx '0.4.54' VERSION; then
            echo '0.4.54 already applied.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          main = Path('src/shell/linux/main.c')
          text = main.read_text()
          text = replace_once(text,
          '''typedef struct {
              GtkListBox *list;
              GtkWindow *parent;
              GtkStack *stack;
              GtkListBoxRow *home_row;
              GtkListBoxRow *date_row;
              gchar *query;
          } ShellSearchState;''',
          '''typedef struct {
              GtkListBox *list;
              GtkWindow *parent;
              GtkStack *stack;
              GtkListBoxRow *home_row;
              GtkListBoxRow *date_row;
              GtkScrolledWindow *date_scroller;
              bool date_time_loaded;
              gchar *query;
          } ShellSearchState;''', 'shell state')
          text = replace_once(text,
          'static void show_about(GtkButton *button, gpointer user_data);\n',
          'static void show_about(GtkButton *button, gpointer user_data);\nstatic GtkWidget *build_unavailable_panel(const char *message);\n',
          'forward declaration')

          ensure = r'''
          static void ensure_date_time_panel(ShellSearchState *state)
          {
              g_autoptr(GError) panel_error = NULL;
              SsLinuxDateTimePanel *date_time;
              GtkWidget *panel_widget;

              if (state == NULL || state->date_time_loaded ||
                  state->date_scroller == NULL || state->parent == NULL) {
                  return;
              }

              /*
               * First paint belongs to the shell. Date & Time owns timezone
               * catalogue parsing, policy observation and timedated setup, so
               * do not pay for that module until the user actually opens it.
               * This is the same lazy-page boundary used by the wider
               * InfiltratorOS application family.
               */
              state->date_time_loaded = true;
              date_time = ss_linux_date_time_panel_new(
                  state->parent, &panel_error);
              if (date_time != NULL) {
                  g_object_set_data_full(
                      G_OBJECT(state->parent),
                      "system-settings-date-time-panel",
                      date_time,
                      ss_linux_date_time_panel_free);
                  panel_widget = ss_linux_date_time_panel_widget(date_time);
              } else {
                  panel_widget = build_unavailable_panel(
                      panel_error != NULL
                          ? panel_error->message
                          : "Unable to initialise Date & Time.");
              }
              gtk_scrolled_window_set_child(
                  state->date_scroller, panel_widget);
          }

          '''
          text = replace_once(text,
          'static void on_navigation_selected(GtkListBox *box,\n',
          ensure + 'static void on_navigation_selected(GtkListBox *box,\n',
          'lazy panel insertion')

          old_nav = '''static void on_navigation_selected(GtkListBox *box,
                                             GtkListBoxRow *row,
                                             gpointer user_data)
          {
              GtkStack *stack = GTK_STACK(user_data);
              const char *page_name;

              (void)box;
              if (row == NULL || stack == NULL) {
                  return;
              }

              page_name = g_object_get_data(G_OBJECT(row), "page-name");
              if (page_name != NULL) {
                  gtk_stack_set_visible_child_name(stack, page_name);
              }
          }'''
          new_nav = '''static void on_navigation_selected(GtkListBox *box,
                                             GtkListBoxRow *row,
                                             gpointer user_data)
          {
              ShellSearchState *state = user_data;
              const char *page_name;

              (void)box;
              if (row == NULL || state == NULL || state->stack == NULL) {
                  return;
              }

              page_name = g_object_get_data(G_OBJECT(row), "page-name");
              if (page_name != NULL) {
                  if (g_strcmp0(page_name, "date-time") == 0) {
                      ensure_date_time_panel(state);
                  }
                  gtk_stack_set_visible_child_name(state->stack, page_name);
              }
          }'''
          text = replace_once(text, old_nav, new_nav, 'navigation lazy load')
          text = replace_once(text,
          '''    g_signal_connect(
                  list, "row-selected",
                  G_CALLBACK(on_navigation_selected), stack);''',
          '''    g_signal_connect(
                  list, "row-selected",
                  G_CALLBACK(on_navigation_selected), search_state);''',
          'navigation callback state')
          text = replace_once(text,
          '''    if (state == NULL || state->stack == NULL) return;
              gtk_stack_set_visible_child_name(state->stack, "date-time");''',
          '''    if (state == NULL || state->stack == NULL) return;
              ensure_date_time_panel(state);
              gtk_stack_set_visible_child_name(state->stack, "date-time");''',
          'quick date lazy load')

          old_updates = '''    g_object_set_data_full(
                  G_OBJECT(updates_button),
                  "action-program",
                  g_strdup("infiltrator-software"),
                  g_free);
              g_autofree gchar *software_path =
                  g_find_program_in_path("infiltrator-software");'''
          new_updates = '''    g_autofree gchar *software_path =
                  find_trusted_system_program("infiltrator-software");
              g_object_set_data_full(
                  G_OBJECT(updates_button),
                  "action-program",
                  g_strdup(software_path),
                  g_free);'''
          text = replace_once(text, old_updates, new_updates, 'trusted updates launcher')

          text = replace_once(text,
          '    g_autoptr(GError) panel_error = NULL;\n', '', 'eager panel error declaration')
          text = replace_once(text,
          '    SsLinuxDateTimePanel *date_time;\n', '', 'eager panel declaration')
          text = replace_once(text,
          '    GtkWidget *panel_widget;\n', '', 'eager panel widget declaration')
          eager = '''    date_time = ss_linux_date_time_panel_new(
                  window, &panel_error);
              if (date_time != NULL) {
                  /*
                   * The host window owns the current built-in module instance. Async
                   * module operations retain a window reference while in flight. Closing
                   * detaches the panel first, so late replies find NULL rather than widgets.
                   */
                  g_object_set_data_full(
                      G_OBJECT(window),
                      "system-settings-date-time-panel",
                      date_time,
                      ss_linux_date_time_panel_free);
                  panel_widget =
                      ss_linux_date_time_panel_widget(date_time);
              } else {
                  panel_widget = build_unavailable_panel(
                      panel_error != NULL
                          ? panel_error->message
                          : "Unable to initialise Date & Time.");
              }

          '''
          text = replace_once(text, eager, '', 'eager panel construction')
          text = replace_once(text,
          '''    gtk_scrolled_window_set_child(
                  GTK_SCROLLED_WINDOW(date_scroller),
                  panel_widget);''',
          '''    search_state->date_scroller =
                  GTK_SCROLLED_WINDOW(date_scroller);''',
          'lazy date scroller ownership')
          text = replace_once(text,
          '    gtk_stack_set_transition_duration(stack, 170U);',
          '    gtk_stack_set_transition_duration(stack, 110U);',
          'suite transition cadence')
          main.write_text(text)

          helpers = Path('src/shell/linux/linux-ui-helpers.c')
          text = helpers.read_text()
          text = replace_once(text,
          '#include "linux-ui-helpers.h"\n',
          '#include "linux-ui-helpers.h"\n\n#include <infiltratr/design.h>\n',
          'helper Common include')
          text = replace_once(text,
          '''    GtkWidget *box = gtk_box_new(GTK_ORIENTATION_VERTICAL, 3);
              GtkWidget *heading =''',
          '''    const InfiltratrDesignMetrics *metrics =
                  infiltratr_design_metrics();
              GtkWidget *box = gtk_box_new(
                  GTK_ORIENTATION_VERTICAL,
                  metrics != NULL ? (int)metrics->compact_spacing : 6);
              GtkWidget *heading =''',
          'identity spacing')
          text = replace_once(text,
          '''    GtkWidget *row;

              if (control == NULL) {''',
          '''    GtkWidget *row;
              const InfiltratrDesignMetrics *metrics =
                  infiltratr_design_metrics();

              if (control == NULL) {''',
          'row metrics')
          text = replace_once(text,
          '    row = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 18);',
          '''    row = gtk_box_new(
                  GTK_ORIENTATION_HORIZONTAL,
                  metrics != NULL ? (int)metrics->section_spacing : 18);''',
          'row spacing')
          text = replace_once(text,
          '''    GtkWidget *icon;

              if (control == NULL) {''',
          '''    GtkWidget *icon;
              const InfiltratrDesignMetrics *metrics =
                  infiltratr_design_metrics();

              if (control == NULL) {''',
          'tile metrics')
          text = replace_once(text,
          '    tile = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 13);',
          '''    tile = gtk_box_new(
                  GTK_ORIENTATION_HORIZONTAL,
                  metrics != NULL ? (int)metrics->control_spacing : 10);''',
          'tile spacing')
          helpers.write_text(text)

          panel_ui = Path('src/modules/date-time/linux-date-time-panel-ui.c')
          text = panel_ui.read_text()
          text = replace_once(text,
          '#include <infiltratr/temporal.h>\n',
          '''#include <infiltratr/design.h>
          #include <infiltratr/temporal.h>

          static int common_compact_spacing(void)
          {
              const InfiltratrDesignMetrics *metrics = infiltratr_design_metrics();
              return metrics != NULL ? (int)metrics->compact_spacing : 6;
          }

          static int common_control_spacing(void)
          {
              const InfiltratrDesignMetrics *metrics = infiltratr_design_metrics();
              return metrics != NULL ? (int)metrics->control_spacing : 10;
          }

          static int common_section_spacing(void)
          {
              const InfiltratrDesignMetrics *metrics = infiltratr_design_metrics();
              return metrics != NULL ? (int)metrics->section_spacing : 18;
          }
          ''',
          'panel Common spacing helpers')
          text = text.replace(
              'gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 10)',
              'gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_control_spacing())')
          text = text.replace(
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, 1)',
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing())')
          text = replace_once(text,
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, 4)',
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing())',
              'coordinate compact spacing')
          text = replace_once(text,
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, 7)',
              'gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing())',
              'manual compact spacing')
          replacements = {
              'GtkWidget *page = gtk_box_new(GTK_ORIENTATION_VERTICAL, 18);':
                  'GtkWidget *page = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_section_spacing());',
              'GtkWidget *page_header = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 14);':
                  'GtkWidget *page_header = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_control_spacing());',
              'GtkWidget *hero_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, 8);':
                  'GtkWidget *hero_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing());',
              'GtkWidget *hero_top = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 20);':
                  'GtkWidget *hero_top = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_section_spacing());',
              'GtkWidget *hero_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, 3);':
                  'GtkWidget *hero_copy = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing());',
              'GtkWidget *overview_panel = gtk_box_new(GTK_ORIENTATION_VERTICAL, 8);':
                  'GtkWidget *overview_panel = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_compact_spacing());',
              'GtkWidget *hero_badge = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 7);':
                  'GtkWidget *hero_badge = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_compact_spacing());',
              'GtkWidget *location_strip = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 8);':
                  'GtkWidget *location_strip = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_compact_spacing());',
              'GtkWidget *location_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, 12);':
                  'GtkWidget *location_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_control_spacing());',
              'GtkWidget *presentation_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, 10);':
                  'GtkWidget *presentation_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_control_spacing());',
              'GtkWidget *system_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, 10);':
                  'GtkWidget *system_card = gtk_box_new(GTK_ORIENTATION_VERTICAL, common_control_spacing());',
              'search_box = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, 8);':
                  'search_box = gtk_box_new(GTK_ORIENTATION_HORIZONTAL, common_control_spacing());',
              'gtk_grid_set_row_spacing(GTK_GRID(overview_grid), 8);':
                  'gtk_grid_set_row_spacing(GTK_GRID(overview_grid), (guint)common_compact_spacing());',
              'gtk_grid_set_column_spacing(GTK_GRID(overview_grid), 8);':
                  'gtk_grid_set_column_spacing(GTK_GRID(overview_grid), (guint)common_compact_spacing());',
              'gtk_grid_set_column_spacing(GTK_GRID(coordinate_box), 10U);':
                  'gtk_grid_set_column_spacing(GTK_GRID(coordinate_box), (guint)common_control_spacing());',
              'gtk_flow_box_set_column_spacing(GTK_FLOW_BOX(lower), 12U);':
                  'gtk_flow_box_set_column_spacing(GTK_FLOW_BOX(lower), (guint)common_control_spacing());',
              'gtk_flow_box_set_row_spacing(GTK_FLOW_BOX(lower), 12U);':
                  'gtk_flow_box_set_row_spacing(GTK_FLOW_BOX(lower), (guint)common_control_spacing());',
              'gtk_flow_box_set_column_spacing(GTK_FLOW_BOX(manual_box), 7U);':
                  'gtk_flow_box_set_column_spacing(GTK_FLOW_BOX(manual_box), (guint)common_compact_spacing());',
              'gtk_flow_box_set_row_spacing(GTK_FLOW_BOX(manual_box), 7U);':
                  'gtk_flow_box_set_row_spacing(GTK_FLOW_BOX(manual_box), (guint)common_compact_spacing());',
          }
          for old, new in replacements.items():
              text = replace_once(text, old, new, f'panel spacing {old[:35]}')
          panel_ui.write_text(text)

          home_h = Path('src/modules/date-time/home-temporal-presentation.h')
          text = home_h.read_text()
          text = replace_once(text,
          '''/** Same pure-output ownership contract as ss_home_temporal_presentation_format(). */
          bool ss_home_temporal_presentation_now(
              SsHomeTemporalPresentation *out);

          ''', '', 'dead one-shot header API')
          home_h.write_text(text)

          home_c = Path('src/modules/date-time/home-temporal-presentation.c')
          text = home_c.read_text()
          dead = '''
          bool ss_home_temporal_presentation_now(
              SsHomeTemporalPresentation *out)
          {
              SsHomeTemporalPresenter *presenter;
              bool ok;
              if (out == NULL) return false;
              presenter = ss_home_temporal_presenter_new();
              if (presenter == NULL) return false;
              ok = ss_home_temporal_presenter_format_now(presenter, out);
              ss_home_temporal_presenter_free(presenter);
              return ok;
          }'''
          text = replace_once(text, dead, '', 'dead one-shot implementation')
          home_c.write_text(text)

          test = Path('tests/linux-shell-test.c')
          text = test.read_text()
          old_panel = '''        SsLinuxDateTimePanel *panel = g_object_get_data(
                      G_OBJECT(window), "system-settings-date-time-panel");
                  g_assert_nonnull(panel);
                  g_assert_nonnull(panel->policy_observer);'''
          new_panel = '''        ShellSearchState *runtime_search_state = g_object_get_data(
                      G_OBJECT(window), "system-settings-search-state");
                  g_assert_nonnull(runtime_search_state);
                  g_assert_false(runtime_search_state->date_time_loaded);
                  g_assert_null(g_object_get_data(
                      G_OBJECT(window), "system-settings-date-time-panel"));
                  gtk_list_box_select_row(
                      runtime_search_state->list,
                      runtime_search_state->date_row);
                  while (g_main_context_iteration(NULL, FALSE)) {
                  }
                  SsLinuxDateTimePanel *panel = g_object_get_data(
                      G_OBJECT(window), "system-settings-date-time-panel");
                  g_assert_true(runtime_search_state->date_time_loaded);
                  g_assert_nonnull(panel);
                  g_assert_nonnull(panel->policy_observer);'''
          text = replace_once(text, old_panel, new_panel, 'lazy shell regression')
          text = replace_once(text,
          '''        g_assert_true(GTK_IS_LIST_BOX(navigation));
                  GtkWidget *header_end =''',
          '''        g_assert_true(GTK_IS_LIST_BOX(navigation));
                  g_assert_cmpuint(
                      gtk_stack_get_transition_duration(stack), ==, 110U);
                  gtk_list_box_select_row(
                      navigation, runtime_search_state->home_row);
                  while (g_main_context_iteration(NULL, FALSE)) {
                  }
                  if (i == 0) {
                      g_autofree gchar *trusted_shell =
                          find_trusted_system_program("sh");
                      g_assert_nonnull(trusted_shell);
                      g_assert_true(g_path_is_absolute(trusted_shell));
                      g_assert_null(find_trusted_system_program("../sh"));
                  }
                  GtkWidget *header_end =''',
          'transition and trusted resolver regression')
          test.write_text(text)

          arch = Path('docs/ARCHITECTURE.md')
          text = arch.read_text()
          text = replace_once(text,
          '''The Calendar bridge still exposes a clock-format compatibility entry point and
          its fixture tests that ABI, but the current panel's clock preview uses Common.
          Without Calendar, non-Gregorian dates explicitly report preview unavailable;
          clock selection, clock rendering and persistence remain available.''',
          '''The Calendar bridge now exposes only the chronology/date-format ABI required
          for non-Gregorian previews. The retired Calendar-owned clock-format compatibility
          surface has been removed: every clock preview is rendered by Common. Without
          Calendar, non-Gregorian dates explicitly report preview unavailable; clock
          selection, clock rendering and persistence remain available.''',
          'architecture stale Calendar clock ABI')
          text = replace_once(text,
          '''Missing-runtime retries are throttled to five seconds. Accepted Linux runtimes
          remain resident because GLib retains registered static GType callbacks after
          provider teardown; replacing an already loaded runtime requires restarting the
          process.''',
          '''Missing-runtime discovery backs off exponentially from five seconds to a
          sixty-second ceiling, so an absent optional Calendar runtime cannot become a
          recurring GTK-thread filesystem scan. Accepted Linux runtimes remain resident
          because GLib retains registered static GType callbacks after provider teardown;
          replacing an already loaded runtime requires restarting the process.''',
          'architecture retry policy')
          marker = '''### Current lifecycle and persistence boundaries

          The application presents its existing window on repeated activation.'''
          replacement = '''### Current lifecycle and persistence boundaries

          The shell constructs Home first and creates the built-in Date & Time panel only
          on first selection. Time-zone catalogue parsing, policy observers and timedated
          proxy setup therefore do not participate in shell first paint.

          The application presents its existing window on repeated activation.'''
          text = replace_once(text, marker, replacement, 'architecture lazy lifecycle')
          arch.write_text(text)

          policy = Path('docs/PRESENTATION_POLICY.md')
          text = policy.read_text()
          text = replace_once(text,
          '''Common provides the exact generic conventional/decimal formatter. Calendar owns
          the specialised clock and chronology implementations. System Settings may
          consume Calendar's stable runtime ABI for previewing those modes, while
          remaining the authority for which mode/calendar is selected.

          If the provider is unavailable, the preview must say so explicitly rather than
          inventing an approximation.''',
          '''Common provides the authoritative formatter for every supported clock mode,
          including the specialised historical and astronomical systems. Calendar remains
          the implementation owner of non-Gregorian chronology/date arithmetic, and System
          Settings may consume Calendar's stable date-format runtime ABI for those previews
          while remaining the authority for which clock/calendar is selected.

          If the optional chronology provider is unavailable, the affected non-Gregorian
          date preview must say so explicitly rather than inventing an approximation.''',
          'presentation ownership stale clock text')
          policy.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''## 0.4.54 — 2026-10-03

          - Make the built-in Date & Time panel genuinely lazy: Home first paint no longer constructs the panel, parses the time-zone catalogue, installs its policy/locality observers or starts timedated setup until Date & Time is first selected.
          - Remove the obsolete one-shot `ss_home_temporal_presentation_now()` path that constructed and destroyed a full presenter for a single value; Home now has one long-lived presenter path only.
          - Route the Home “Check for updates” action through the same fixed trusted-system executable resolver used by navigation and Quick Actions instead of falling back to `PATH` lookup.
          - Align Date & Time row/tile/page spacing directly with Common `InfiltratrDesignMetrics`, and reduce shell page crossfade to the 110 ms cadence already used by the InfiltratorOS desktop family.
          - Correct maintained architecture/presentation documentation left behind by earlier iterations: Common owns all clock rendering, Calendar supplies only non-Gregorian date previews, and failed optional-runtime discovery backs off from 5 seconds to a 60-second ceiling.
          - Re-verified the exact Common 1.19.38 pin `7070c5812b50821fd7580101cb2289a3184f6b2c` against current `Infiltrator-Libraries` main; no gitlink movement is required.

          '''
          if text.startswith('## 0.4.53'):
              changelog.write_text(entry + text)
          else:
              raise SystemExit('CHANGELOG does not start at 0.4.53')

          Path('VERSION').write_text('0.4.54')
          PY

          git diff --check
          git status --short
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add VERSION CHANGELOG.md docs/ARCHITECTURE.md docs/PRESENTATION_POLICY.md \
            src/shell/linux/main.c src/shell/linux/linux-ui-helpers.c \
            src/modules/date-time/linux-date-time-panel-ui.c \
            src/modules/date-time/home-temporal-presentation.c \
            src/modules/date-time/home-temporal-presentation.h \
            tests/linux-shell-test.c
          git commit -m "Release 0.4.54 - lazy modules and Common spacing cleanup"
          git push origin HEAD:hal/system-settings-forensic-0.4.54
