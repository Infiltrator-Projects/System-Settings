# SPDX-License-Identifier: GPL-3.0-or-later
name: one-shot-changelog-backfill

on:
  push:
    branches: [fix/quality-hardening-0.4.77]

permissions:
  contents: write

jobs:
  backfill:
    if: ${{ !startsWith(github.event.head_commit.message, 'Backfill missing release history') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/quality-hardening-0.4.77
          fetch-depth: 0
      - name: Prepend missing release history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          current = path.read_text(encoding='utf-8')
          if current.startswith('## 0.4.77'):
              raise SystemExit(0)
          prefix = '''## 0.4.77 — 2026-10-12

- Restore continuous maintained release history for 0.4.70 through 0.4.76 so the repository changelog again matches the releases that were actually published.
- Add a dedicated Clang path-sensitive static-analysis CI gate over System Settings translation units and tests, excluding the separately owned pinned Common source.

## 0.4.76 — 2026-10-12

- Centralise the built-in Date & Time page and manifest identity so Home routing and the module host cannot silently drift onto different string literals.
- Hide Date & Time model authority state behind its private implementation and replace CLI field/store mutation with validated non-authoritative policy drafts.
- Run the full CI matrix on pull requests before merge and keep central APT propagation observable without allowing downstream pull latency to invalidate a verified GitHub release.

## 0.4.75 — 2026-10-11

- Replace Home's registry-order dependency with an explicit semantic Date & Time destination and add a routing regression for the actual registered page.
- Extract protected timezone, NTP and manual-time lifecycle/cancellation behind a narrow compiler-enforced system-time boundary while leaving cross-domain reconciliation in the Date & Time coordinator.

## 0.4.74 — 2026-10-11

- Replace shell magic widget-data contracts with typed navigation/window-owned state.
- Replace Home magic widget-data contracts with typed Home state so private GTK object-data keys no longer form hidden application contracts.

## 0.4.73 — 2026-10-11

- Reduce the remaining Linux UI controller brittleness by narrowing controller ownership and removing dependencies on incidental private implementation state.
- Revalidate the Linux UI lifecycle and controller boundaries before release.

## 0.4.72 — 2026-10-11

- Separate generic application identity/version/build-profile ownership from the Date & Time domain core so the shell no longer acquires temporal-domain coupling merely to identify the product.

## 0.4.71 — 2026-10-11

- Make Linux shell module navigation manifest-driven instead of duplicating module presentation metadata in shell code.
- Enforce generic-shell versus Date & Time domain separation with compiler-visible contracts so forbidden dependencies fail at build time.

## 0.4.70 — 2026-10-11

- Finish the next structural coupling reductions across the Linux shell and Date & Time implementation.
- Enforce Date & Time locality boundaries so location/search/journal state cannot casually reach unrelated panel internals.

'''
          path.write_text(prefix + current, encoding='utf-8')
          PY
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'Backfill missing release history'
          git push origin HEAD:fix/quality-hardening-0.4.77
