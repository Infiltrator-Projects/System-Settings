name: tighten-location-boundary-retry

on:
  push:
    branches:
      - fix/brittleness-next3

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected locality boundary refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/tighten-location-boundary.yml')
          workflow = source_path.read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])

          needle = "location_text = Path(location).read_text()"
          extra = '''replace_once(\n    location,\n    """    state->location.coordinate_commit_id = 0U;\n    if (state->updating_controls) {\n""",\n    """    state->location.coordinate_commit_id = 0U;\n    if (state->location.updating_controls) {\n""",\n    'coordinate commit locality guard')\n\n'''
          if needle not in script:
              raise SystemExit('Could not locate locality post-check insertion point')
          script = script.replace(needle, extra + needle, 1)
          exec(compile(script, '<tighten-location-boundary>', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/tighten-location-boundary-retry.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce Date Time locality ownership boundary"
          git push origin HEAD:fix/brittleness-next3
