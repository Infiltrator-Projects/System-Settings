name: HAL Home layout 0.4.59 transform

on:
  push:
    branches:
      - hal/home-space-0.4.59

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply Home density fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/shell/linux/main.c')
          text = main.read_text()
          old = '    return width >= 1240 ? 2U : 1U;'
          new = '    return width >= 720 ? 2U : 1U;'
          if text.count(old) != 1:
              raise SystemExit('Home breakpoint expression not found exactly once')
          text = text.replace(old, new, 1)
          old = '    gtk_flow_box_set_homogeneous(GTK_FLOW_BOX(status_grid), TRUE);\n'
          new = (
              '    /* Keep separate status rows at their natural content height. */\n'
              '    gtk_flow_box_set_homogeneous(GTK_FLOW_BOX(status_grid), FALSE);\n'
          )
          if text.count(old) != 1:
              raise SystemExit('status grid homogeneous setting not found exactly once')
          text = text.replace(old, new, 1)
          main.write_text(text)

          test = Path('tests/linux-shell-test.c')
          text = test.read_text()
          old = '        g_assert_cmpuint(home_layout_columns_for_width(900), ==, 1U);\n'
          new = (
              '        g_assert_cmpuint(home_layout_columns_for_width(680), ==, 1U);\n'
              '        g_assert_cmpuint(home_layout_columns_for_width(900), ==, 2U);\n'
          )
          if text.count(old) != 1:
              raise SystemExit('layout breakpoint assertion not found exactly once')
          text = text.replace(old, new, 1)
          old = '        home_layout_apply_width(adaptive_layout, 1400);\n'
          new = (
              '        g_assert_false(gtk_flow_box_get_homogeneous(\n'
              '            GTK_FLOW_BOX(home_status_grid_geometry)));\n'
              '        home_layout_apply_width(adaptive_layout, 900);\n'
          )
          if text.count(old) != 1:
              raise SystemExit('wide layout apply call not found exactly once')
          text = text.replace(old, new, 1)
          old = '        home_layout_apply_width(adaptive_layout, 900);\n        while (g_main_context_iteration(NULL, FALSE)) {\n'
          new = '        home_layout_apply_width(adaptive_layout, 680);\n        while (g_main_context_iteration(NULL, FALSE)) {\n'
          if text.count(old) != 1:
              raise SystemExit('compact layout apply call not found exactly once')
          text = text.replace(old, new, 1)
          test.write_text(text)

          version = Path('VERSION')
          if version.read_text().strip() != '0.4.58':
              raise SystemExit('unexpected VERSION')
          version.write_text('0.4.59\n')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          entry = '''## 0.4.59 — 2026-10-03

          - Restore the Home dashboard's intended use of horizontal space: Overview/Quick Actions and the four status cards return to two columns from 720 logical pixels instead of waiting for the overly conservative 1240 px breakpoint that left scaled desktops in a giant one-column layout.
          - Stop the four Home status cards from sharing one global homogeneous height. Date & Time and Region & Language now keep row-local natural height instead of inheriting the tallest card's vertical allocation and producing large empty panels.
          - Add shell regressions for the 720 px desktop breakpoint and for non-homogeneous status-card height so this wasted-space layout cannot silently return.

          ## 0.4.58 — 2026-10-03

          - Restore the Software-standard 38 px surface-backed navigation icon wells after 0.4.57 incorrectly flattened them, while retaining the compact scrollbar and expanded Home hero spacing.

          ## 0.4.57 — 2026-10-03

          - Replace the oversized page scrollbars with the compact InfiltratorOS treatment and give the Home hero enough internal/vertical room for its title, subtitle and feature row.
          - The attempted sidebar icon flattening in this release was corrected immediately in 0.4.58.

          ## 0.4.56 — 2026-10-03

          - Defer decoding of the large Home artwork until after first paint so the shell becomes responsive before loading decorative assets.
          - Tighten ordinary setting-row spacing to Common control/compact metrics instead of treating every row as a full section.

          '''
          if current.startswith('## 0.4.59'):
              raise SystemExit('0.4.59 already in changelog')
          changelog.write_text(entry + current)
          PY
          git diff --check
          git status --short
      - name: Commit transformed product files
        shell: bash
        run: |
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/shell/linux/main.c tests/linux-shell-test.c CHANGELOG.md VERSION
          git commit -m "Release 0.4.59 - restore Home dashboard density"
          git push origin HEAD:hal/home-space-0.4.59
