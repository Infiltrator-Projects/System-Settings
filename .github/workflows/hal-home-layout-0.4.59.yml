name: HAL Home layout 0.4.59 transform

on:
  push:
    branches:
      - hal/home-space-0.4.59

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Home density fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/shell/linux/main.c')
          text = main.read_text()

          old = '''/*
 * The original Home design is a two-column desktop dashboard, but forcing
 * those two columns into the widget's minimum size makes a scaled 1920x1080
 * desktop impossible to fit. Keep the minimum request compact, then lock the
 * two desktop rows together only once the actual Home viewport is wide enough
 * to contain both cards without inflating the window.
 */
static guint home_layout_columns_for_width(int width)
{
    return width >= 1240 ? 2U : 1U;
}
'''
          new = '''/*
 * Home is a desktop dashboard first.  The earlier 1240 px breakpoint was far
 * too conservative once desktop scaling and the navigation rail were applied:
 * wide windows collapsed into one enormous column and every status card spent
 * most of its area on empty background.  Keep two columns whenever two useful
 * cards can actually fit; only collapse on genuinely narrow viewports.
 */
static guint home_layout_columns_for_width(int width)
{
    return width >= 720 ? 2U : 1U;
}
'''
          if old not in text:
              raise SystemExit('Home breakpoint block not found')
          text = text.replace(old, new, 1)

          old = '    gtk_flow_box_set_homogeneous(GTK_FLOW_BOX(status_grid), TRUE);\n'
          new = '''    /*
     * Do not make all four status cards the height of the tallest one.  That
     * turns compact Date/Region content into giant empty panels.  FlowBox may
     * still align cards within each row, but separate rows keep their natural
     * content height.
     */
    gtk_flow_box_set_homogeneous(GTK_FLOW_BOX(status_grid), FALSE);
'''
          if old not in text:
              raise SystemExit('status grid homogeneous setting not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          test = Path('tests/linux-shell-test.c')
          text = test.read_text()
          old = '''        g_assert_cmpuint(home_layout_columns_for_width(900), ==, 1U);
        g_assert_cmpuint(home_layout_columns_for_width(1400), ==, 2U);
        home_layout_apply_width(adaptive_layout, 1400);
'''
          new = '''        g_assert_cmpuint(home_layout_columns_for_width(680), ==, 1U);
        g_assert_cmpuint(home_layout_columns_for_width(900), ==, 2U);
        g_assert_cmpuint(home_layout_columns_for_width(1400), ==, 2U);
        g_assert_false(gtk_flow_box_get_homogeneous(
            GTK_FLOW_BOX(home_status_grid_geometry)));
        home_layout_apply_width(adaptive_layout, 900);
'''
          if old not in text:
              raise SystemExit('wide layout test block not found')
          text = text.replace(old, new, 1)
          marker = '        home_layout_apply_width(adaptive_layout, 900);\n'
          first = text.find(marker)
          second = text.find(marker, first + len(marker))
          if first < 0 or second < 0:
              raise SystemExit('compact layout call not found')
          text = text[:second] + '        home_layout_apply_width(adaptive_layout, 680);\n' + text[second+len(marker):]
          test.write_text(text)

          version = Path('VERSION')
          if version.read_text().strip() != '0.4.58':
              raise SystemExit('unexpected VERSION')
          version.write_text('0.4.59\n')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          entry = '''## 0.4.59 — 2026-10-03

- Restore the Home dashboard's intended use of horizontal space: Overview/Quick Actions and the four status cards return to two columns from 720 logical pixels instead of waiting for the overly conservative 1240 px breakpoint that left scaled desktops in a giant one-column layout.
- Stop the four Home status cards from sharing one global homogeneous height. Date & Time and Region & Language now keep row-local natural height instead of inheriting the tallest card's vertical allocation and producing large empty panels.
- Add shell regressions for the 720 px desktop breakpoint and for non-homogeneous status-card height so this wasted-space layout cannot silently return.

## 0.4.58 — 2026-10-03

- Restore the Software-standard 38 px surface-backed navigation icon wells after 0.4.57 incorrectly flattened them, while retaining the compact scrollbar and expanded Home hero spacing.

## 0.4.57 — 2026-10-03

- Replace the oversized page scrollbars with the compact InfiltratorOS treatment and give the Home hero enough internal/vertical room for its title, subtitle and feature row.
- The attempted sidebar icon flattening in this release was corrected immediately in 0.4.58.

## 0.4.56 — 2026-10-03

- Defer decoding of the large Home artwork until after first paint so the shell becomes responsive before loading decorative assets.
- Tighten ordinary setting-row spacing to Common control/compact metrics instead of treating every row as a full section.

'''
          if current.startswith('## 0.4.59'):
              raise SystemExit('0.4.59 already in changelog')
          changelog.write_text(entry + current)
          PY
          git diff --check
          git status --short
      - name: Commit transformed product files
        shell: bash
        run: |
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/shell/linux/main.c tests/linux-shell-test.c CHANGELOG.md VERSION
          git commit -m "Release 0.4.59 - restore Home dashboard density"
          git push origin HEAD:hal/home-space-0.4.59
