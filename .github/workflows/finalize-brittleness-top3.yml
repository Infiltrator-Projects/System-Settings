name: finalize-brittleness-top3

on:
  push:
    branches: [fix/brittleness-top3]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brittleness-top3
          fetch-depth: 0
          submodules: recursive

      - name: Remove residual shell compatibility scaffolding
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/shell/linux/shell-window.c")
          text = path.read_text()

          old_provider = '''    home_temporal_provider = ss_home_temporal_provider_new();
          if (home_temporal_provider == NULL) {
              gtk_window_destroy(window);
              return;
          }
          g_object_set_data_full(
              G_OBJECT(window),
              "system-settings-home-temporal-provider",
              home_temporal_provider,
              (GDestroyNotify)ss_home_temporal_provider_free);
          '''.replace("          ", "")
          new_provider = '''    home_temporal_provider = ss_home_temporal_provider_new();
              if (home_temporal_provider == NULL) {
                  gtk_window_destroy(window);
                  return;
              }
              g_object_set_data_full(
                  G_OBJECT(window),
                  "system-settings-home-temporal-provider",
                  home_temporal_provider,
                  (GDestroyNotify)ss_home_temporal_provider_free);
          '''.replace("          ", "")

          # The staging script left this block flush-left after the first line.
          # Match its exact current spelling and normalize it.
          current_provider = '''    home_temporal_provider = ss_home_temporal_provider_new();
          if (home_temporal_provider == NULL) {
              gtk_window_destroy(window);
              return;
          }
          g_object_set_data_full(
              G_OBJECT(window),
              "system-settings-home-temporal-provider",
              home_temporal_provider,
              (GDestroyNotify)ss_home_temporal_provider_free);
          '''.replace("          ", "")
          current_provider = current_provider.replace(
              "    home_temporal_provider = ss_home_temporal_provider_new();\n    if",
              "    home_temporal_provider = ss_home_temporal_provider_new();\nif")
          current_provider = current_provider.replace("\n    gtk_window_destroy", "\n    gtk_window_destroy")

          # Use literal text from the branch to avoid depending on indentation
          # generated by YAML/Python dedenting.
          current_provider = (
              "    home_temporal_provider = ss_home_temporal_provider_new();\n"
              "if (home_temporal_provider == NULL) {\n"
              "    gtk_window_destroy(window);\n"
              "    return;\n"
              "}\n"
              "g_object_set_data_full(\n"
              "    G_OBJECT(window),\n"
              "    \"system-settings-home-temporal-provider\",\n"
              "    home_temporal_provider,\n"
              "    (GDestroyNotify)ss_home_temporal_provider_free);\n"
          )
          normalized_provider = (
              "    home_temporal_provider = ss_home_temporal_provider_new();\n"
              "    if (home_temporal_provider == NULL) {\n"
              "        gtk_window_destroy(window);\n"
              "        return;\n"
              "    }\n"
              "    g_object_set_data_full(\n"
              "        G_OBJECT(window),\n"
              "        \"system-settings-home-temporal-provider\",\n"
              "        home_temporal_provider,\n"
              "        (GDestroyNotify)ss_home_temporal_provider_free);\n"
          )
          if text.count(current_provider) != 1:
              raise SystemExit("provider ownership block was not found exactly once")
          text = text.replace(current_provider, normalized_provider, 1)

          obsolete = (
              "    /* Compatibility key retained for the current shell geometry regression. */\n"
              "    g_object_set_data(\n"
              "        G_OBJECT(window),\n"
              "        \"system-settings-date-scroller\",\n"
              "        module_scroller);\n\n"
          )
          if text.count(obsolete) != 1:
              raise SystemExit("obsolete date-scroller compatibility key was not found exactly once")
          text = text.replace(obsolete, "", 1)

          if "system-settings-date-scroller" in text:
              raise SystemExit("date-scroller compatibility key remains")
          path.write_text(text)

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --target package --config Release

      - name: Commit exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-brittleness-top3.yml
          rm .github/workflows/validate-brittleness-top3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten final shell boundary cleanup"
          git push origin HEAD:fix/brittleness-top3
