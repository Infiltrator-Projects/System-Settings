# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL changelog repair

on:
  push:
    branches: ["hal/system-settings-forensic-0.4.54"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/system-settings-forensic-0.4.54
          fetch-depth: 0
          submodules: false
      - shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 0.4.53 ' CHANGELOG.md; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          t = p.read_text()
          if not t.startswith('## 0.4.52'):
              raise SystemExit('unexpected changelog head')
          lines = [
              '## 0.4.53 — 2026-10-03',
              '',
              '- Remove the obsolete Calendar-owned clock-preview ABI and test fixture surface; Common is now the sole formatter for every supported clock mode, while the optional Calendar runtime is retained only for non-Gregorian calendar-date previews.',
              '- Align shell typography colours with Common semantic heading, summary, kicker, detail-label and note roles instead of approximating those roles with generic title/muted colours.',
              '- Normalise remaining shell control geometry to the Common 6/10/12/18 radius vocabulary and keep the current Common 1.19.38 pin `7070c5812b50821fd7580101cb2289a3184f6b2c`.',
              '',
          ]
          p.write_text('\n'.join(lines) + '\n' + t)
          PY
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add CHANGELOG.md
          git commit -m "Document System Settings 0.4.53"
          git push origin HEAD:hal/system-settings-forensic-0.4.54
