# SPDX-License-Identifier: GPL-3.0-or-later
name: forensic-hardening-patch

on:
  push:
    branches: [fix/forensic-hardening-0.4.76]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/forensic-hardening-0.4.76
          fetch-depth: 0

      - name: Apply exact lifecycle and CI-gate edits
        shell: python
        run: |
          from pathlib import Path

          panel = Path("src/modules/date-time/linux-date-time-panel.c")
          text = panel.read_text()
          old = (
              "            ss_linux_date_time_preview_dispose(state);\n"
              "            g_free(state);\n"
              "            return NULL;"
          )
          new = (
              "            ss_linux_date_time_preview_dispose(state);\n"
              "            ss_date_time_model_clear(&state->model);\n"
              "            g_free(state);\n"
              "            return NULL;"
          )
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected 3 constructor cleanup sites, found {count}")
          text = text.replace(old, new)
          old_tail = "    state->lifetime = NULL;\n    g_free(state);\n}"
          new_tail = (
              "    state->lifetime = NULL;\n"
              "    ss_date_time_model_clear(&state->model);\n"
              "    g_free(state);\n}"
          )
          if text.count(old_tail) != 1:
              raise SystemExit("expected one normal panel teardown site")
          panel.write_text(text.replace(old_tail, new_tail))

          header = Path("include/system-settings/date-time-model.h")
          text = header.read_text()
          old_init = "#define SS_DATE_TIME_MODEL_INIT { NULL }"
          if text.count(old_init) != 1:
              raise SystemExit("unexpected model init macro")
          header.write_text(text.replace(old_init, "#define SS_DATE_TIME_MODEL_INIT { 0 }"))

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text()
          old_trigger = "on:\n  push:\n    branches: [main]\n  workflow_dispatch:\n"
          new_trigger = (
              "on:\n"
              "  push:\n"
              "    branches: [main]\n"
              "  pull_request:\n"
              "    branches: [main]\n"
              "  workflow_dispatch:\n"
          )
          if text.count(old_trigger) != 1:
              raise SystemExit("unexpected CI trigger block")
          ci.write_text(text.replace(old_trigger, new_trigger))

          Path(".github/workflows/forensic-hardening-patch.yml").unlink()

      - name: Commit final hardening edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish forensic hardening lifecycle and PR gate"
          git push origin HEAD:fix/forensic-hardening-0.4.76
