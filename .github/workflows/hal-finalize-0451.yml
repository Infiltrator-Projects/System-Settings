name: HAL finalize 0.4.51
on:
  push:
    branches:
      - hal/date-time-ui-density
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Finalize System Settings 0.4.51'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/date-time-ui-density
          fetch-depth: 0
      - name: Finalize changelog and regression
        shell: bash
        run: python3 .github/hal_finalize_0451.py
      - name: Commit final 0.4.51 branch state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/hal_finalize_0451.py .github/workflows/hal-finalize-0451.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git commit -m 'Release 0.4.51 - compact Date and Time UI'
          git push origin HEAD:hal/date-time-ui-density
