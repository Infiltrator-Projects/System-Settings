# SPDX-License-Identifier: GPL-3.0-or-later
name: System Settings CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build and analysis jobs remain read-only. Only the final publish job receives
# contents: write, after every required gate in this same workflow run passes.
permissions:
  contents: read
  actions: read

jobs:
  linux:
    name: Linux build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out source and exact pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON -DSYSTEM_SETTINGS_BUILD_PROFILE=generic

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build reproducible Debian package
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          deb="$(find . -maxdepth 1 -type f -name 'system-settings_*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" "$RUNNER_TEMP/system-settings-first.deb"
          rm -f "$deb"
          cpack -G DEB
          deb="$(find . -maxdepth 1 -type f -name 'system-settings_*.deb' -print -quit)"
          cmp "$RUNNER_TEMP/system-settings-first.deb" "$deb"

      - name: Validate reproducible native release assets
        run: |
          set -euo pipefail
          rm -rf build/source-assets-check build/source-assets-check-2
          ./build/system-settings-source-asset-builder build/source-assets-check
          ./build/system-settings-source-asset-builder build/source-assets-check-2
          native="System-Settings-$(cat VERSION)-native.run"
          source="System-Settings-$(cat VERSION)-source.zip"
          test -s "build/source-assets-check/$native"
          test -s "build/source-assets-check/$source"
          cmp "build/source-assets-check/$native" "build/source-assets-check-2/$native"
          cmp "build/source-assets-check/$source" "build/source-assets-check-2/$source"
          "build/source-assets-check/$native" --build-only

      - name: Validate Debian integration assets
        run: |
          set -euo pipefail
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          marker="$root/usr/share/infiltrator/policy-providers/temporal-v3"
          desktop="$root/usr/share/applications/org.infiltrator.SystemSettings.desktop"
          icon="$root/usr/share/icons/hicolor/scalable/apps/org.infiltrator.SystemSettings.svg"
          module_dir="$root/usr/share/infiltrator/system-settings/modules"
          cmp data/temporal-v3.provider "$marker"
          cmp data/org.infiltrator.SystemSettings.desktop "$desktop"
          cmp data/org.infiltrator.SystemSettings.svg "$icon"
          diff -u \
            <(find modules -maxdepth 1 -type f -name '*.settings-module' -printf '%f\n' | LC_ALL=C sort) \
            <(find "$module_dir" -maxdepth 1 -type f -name '*.settings-module' -printf '%f\n' | LC_ALL=C sort)
          while IFS= read -r manifest; do
            test -n "$manifest"
            cmp "modules/$manifest" "$module_dir/$manifest"
          done < <(find modules -maxdepth 1 -type f -name '*.settings-module' -printf '%f\n' | LC_ALL=C sort)
          ui="$root/usr/share/infiltrator/system-settings/ui"
          binary="$root/Programs/system-settings"
          test -x "$binary"
          test ! -e "$root/usr/bin/system-settings"
          grep -aFq '/usr/share/infiltrator/system-settings/ui' "$binary"
          if grep -aFq '/usr/local/share/infiltrator/system-settings/ui' "$binary"; then
            echo "Packaged binary still contains the wrong /usr/local UI asset path." >&2
            exit 1
          fi
          if grep -aFq "${GITHUB_WORKSPACE}/assets/ui" "$binary" ||
             grep -aFq "${GITHUB_WORKSPACE}/modules" "$binary"; then
            echo "Qualified package embeds a development checkout fallback." >&2
            exit 1
          fi
          diff -u \
            <(find assets/ui -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort) \
            <(find "$ui" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          while IFS= read -r asset; do
            test -n "$asset"
            cmp "assets/ui/$asset" "$ui/$asset"
          done < <(find assets/ui -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq 'libgeocode-glib-2-0|libgeocode-glib0' <<<"$depends"
          rm -rf "$root"

      - name: Stage exact tested release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          bundle="build/release-assets"
          deb="$(find build -maxdepth 1 -type f -name "system-settings_${version}_*.deb" -print -quit)"
          native="build/source-assets-check/System-Settings-${version}-native.run"
          source="build/source-assets-check/System-Settings-${version}-source.zip"
          test -s "$deb"
          test -s "$native"
          test -s "$source"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          cp "$deb" "$native" "$source" "$bundle/"
          test "$(find "$bundle" -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload exact tested release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: system-settings-release-assets
          path: build/release-assets/*
          if-no-files-found: error

  static-analysis:
    name: Clang static analysis
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out source and exact pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Clang analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy jq libgtk-4-dev libgeocode-glib-dev pkg-config

      - name: Configure compilation database
        run: |
          cmake -S . -B build-static-analysis \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Analyze System Settings translation units
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sources < <(
            jq -r '.[].file' build-static-analysis/compile_commands.json \
              | grep -v '/src/vendor/' \
              | sort -u
          )
          if (( ${#sources[@]} == 0 )); then
            echo "No System Settings translation units found in compilation database." >&2
            exit 1
          fi
          printf 'Analyzing %d System Settings translation units.\n' "${#sources[@]}"
          # Clang's DeprecatedOrUnsafeBufferHandling checker recommends C11
          # Annex-K *_s functions that glibc deliberately does not implement
          # and reports bounded snprintf/memcpy/memset/fprintf calls as errors.
          # Keep the rest of the analyzer family strict, including unbounded
          # strcpy, dead stores, nullability and lifetime diagnostics.
          printf '%s\0' "${sources[@]}" \
            | xargs -0 -r -n 20 clang-tidy \
                -p build-static-analysis \
                --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
                --warnings-as-errors='clang-analyzer-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling'

  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      PSExecutionPolicyPreference: RemoteSigned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: powershell
        run: |
          $jobs = [Math]::Max([Environment]::ProcessorCount - 1, 1)
          cmake --build build --config Release --parallel $jobs

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out source and exact pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized targets
        run: cmake --build build-sanitized --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test non-GTK code with ASan, UBSan and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure -E linux-shell

      - name: Test GTK shell with ASan, UBSan and leak detection
        env:
          # GTK/Pango/fontconfig retain a few documented process-global
          # caches. Suppress those exact external stacks instead of disabling
          # LeakSanitizer for the entire application shell.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure -R linux-shell

  publish:
    name: Publish exact tested release
    needs: [linux, static-analysis, windows, sanitizers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, linux-native]
    concurrency:
      group: system-settings-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require releasable current main
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

          mapfile -t branch_refs < <(
            git ls-remote --heads origin | awk '{print $2}' | LC_ALL=C sort
          )
          if [[ ${#branch_refs[@]} -ne 1 || "${branch_refs[0]}" != "refs/heads/main" ]]; then
            printf 'Release requires exactly one remote branch, refs/heads/main. Found:\n' >&2
            printf '  %s\n' "${branch_refs[@]}" >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          candidate=true

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          if [[ "$current_main" != "$expected" ]]; then
            candidate=false
            echo "Ignoring stale successful CI run $expected; main is now $current_main."
          else
            existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$existing" && "$existing" != "$expected" ]]; then
              echo "VERSION $version is already owned by $existing; current main $expected must use a new version before CI can be green." >&2
              exit 1
            fi
          fi

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Download exact CI-tested release bytes
        if: steps.classify.outputs.candidate == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: system-settings-release-assets
          path: release-assets

      - name: Seal exact tested bundle for publication
        if: steps.classify.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tested_assets < <(
            find release-assets -maxdepth 1 -type f -print | sort
          )
          if [[ ${#tested_assets[@]} -eq 0 ]]; then
            echo "CI release bundle is empty." >&2
            exit 1
          fi
          for asset in "${tested_assets[@]}"; do
            test -s "$asset"
          done

          # CI owns the asset contract. Publication adds only the checksum file;
          # it never rebuilds or renames the already-tested release bytes.
          (
            cd release-assets
            rm -f SHA256SUMS
            mapfile -t names < <(
              find . -maxdepth 1 -type f -printf '%f\n' | sort
            )
            if [[ ${#names[@]} -eq 0 ]]; then
              echo "CI release bundle contained no publishable files." >&2
              exit 1
            fi
            sha256sum "${names[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish or complete release
        if: steps.classify.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          tag="${{ steps.classify.outputs.tag }}"
          sha="${{ steps.classify.outputs.sha }}"

          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f -print | sort
          )
          test -s release-assets/SHA256SUMS
          [[ ${#assets[@]} -ge 2 ]]

          tag_target="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$tag_target" && "$tag_target" != "$sha" ]]; then
            echo "Tag $tag already points to $tag_target, not tested commit $sha." >&2
            exit 1
          fi

          expected_names="$(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          )"
          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT

          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing published bytes are immutable. A rerun may complete a
            # partial release by adding a missing expected asset, but it must
            # never replace an asset that already exists under this tag.
            existing_names="$(
              gh release view "$tag" --json assets --jq '.assets[].name' | sort
            )"
            while IFS= read -r existing_name; do
              [[ -z "$existing_name" ]] && continue
              if ! grep -Fxq -- "$existing_name" <<< "$expected_names"; then
                echo "Release $tag contains unexpected immutable asset $existing_name." >&2
                exit 1
              fi
            done <<< "$existing_names"

            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if grep -Fxq -- "$name" <<< "$existing_names"; then
                gh release download "$tag" --pattern "$name" --dir "$verify"
                if ! cmp "$asset" "$verify/$name"; then
                  echo "Published asset $name differs from the exact tested bytes; refusing to replace it." >&2
                  exit 1
                fi
              else
                gh release upload "$tag" "$asset"
              fi
            done
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$sha" \
              --title "System Settings $version" \
              --generate-notes
          fi

          actual_names="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          test "$actual_names" = "$expected_names"

          rm -rf "$verify"
          mkdir -p "$verify"
          gh release download "$tag" --dir "$verify"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$verify/$(basename "$asset")"
          done
          (cd "$verify" && sha256sum -c SHA256SUMS)

# Central APT publication remains owned by Infiltrator-Repository. It discovers
# verified GitHub releases and publishes its own signed catalogue independently.
