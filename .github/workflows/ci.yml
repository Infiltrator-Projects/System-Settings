# SPDX-License-Identifier: GPL-3.0-or-later
name: System Settings CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build, test and package
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-24.04' || 'bigbedroom' }}
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux UI dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Verify self-hosted Linux UI dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in git cmake ctest pkg-config dpkg-deb; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build Debian package
        run: |
          cd build
          cpack -G DEB

      - name: Validate Debian integration assets
        run: |
          set -euo pipefail
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          marker="$root/usr/share/infiltrator/policy-providers/temporal-v3"
          test -f "$marker"
          grep -qx 'provider=infiltrator-system-settings' "$marker"
          grep -qx 'policy-version=3' "$marker"
          grep -qx 'contract=infiltratr-temporal-v3' "$marker"
          desktop="$root/usr/share/applications/org.infiltrator.SystemSettings.desktop"
          icon="$root/usr/share/icons/hicolor/scalable/apps/org.infiltrator.SystemSettings.svg"
          test -f "$desktop"
          test -f "$icon"
          grep -qx 'Icon=org.infiltrator.SystemSettings' "$desktop"
          grep -q '#00ADEF' "$icon"
          ui="$root/usr/share/infiltrator/system-settings/ui"
          for asset in hero-asset.png overview-asset.png date-asset.png region-asset.png network-asset.png theme-light.png theme-dark.png theme-follow.png theme-mercedes.png; do
            test -s "$ui/$asset"
          done
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq 'libgeocode-glib-2-0|libgeocode-glib0' <<<"$depends"
          rm -rf "$root"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error

  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: |
          $jobs = [Math]::Max([Environment]::ProcessorCount - 1, 1)
          cmake --build build --config Release --parallel $jobs

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-24.04' || 'bigbedroom' }}
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux UI dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Verify self-hosted sanitizer dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in git cmake ctest cc pkg-config; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0

      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON             -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON             -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"             -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"             -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized targets
        run: cmake --build build-sanitized --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
