# SPDX-License-Identifier: GPL-3.0-or-later
name: System Settings CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-latest' || 'linux-native') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config
      - name: Verify self-hosted Linux UI dependencies
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake ctest pkg-config dpkg-deb; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0 || pkg-config --exists geocode-glib-1.0
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G DEB
      - name: Validate Debian integration assets
        if: runner.os == 'Linux'
        run: |
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          marker="$root/usr/share/infiltrator/policy-providers/temporal-v3"
          test -f "$marker"
          grep -qx 'provider=infiltrator-system-settings' "$marker"
          grep -qx 'policy-version=3' "$marker"
          grep -qx 'contract=infiltratr-temporal-v3' "$marker"
          desktop="$root/usr/share/applications/org.infiltrator.SystemSettings.desktop"
          icon="$root/usr/share/icons/hicolor/scalable/apps/org.infiltrator.SystemSettings.svg"
          test -f "$desktop"
          test -f "$icon"
          grep -qx 'Icon=org.infiltrator.SystemSettings' "$desktop"
          grep -q '#00ADEF' "$icon"
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq 'libgeocode-glib-2-0|libgeocode-glib0' <<<"$depends"
          rm -rf "$root"
      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error


  sanitizers:
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-latest' || 'linux-native' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux UI dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config
      - name: Verify self-hosted sanitizer dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake ctest cc pkg-config; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0 || pkg-config --exists geocode-glib-1.0
      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized targets
        run: cmake --build build-sanitized --parallel
      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
