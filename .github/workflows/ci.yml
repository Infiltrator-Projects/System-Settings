# SPDX-License-Identifier: GPL-3.0-or-later
name: System Settings CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G DEB
      - name: Validate Debian temporal provider capability
        if: runner.os == 'Linux'
        run: |
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -c "$deb" | grep -q 'usr/share/infiltrator/policy-providers/temporal-v3
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error

          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          test -f "$root/usr/share/infiltrator/policy-providers/temporal-v3"
          grep -qx 'provider=infiltrator-system-settings'             "$root/usr/share/infiltrator/policy-providers/temporal-v3"
          grep -qx 'policy-version=3'             "$root/usr/share/infiltrator/policy-providers/temporal-v3"
          grep -qx 'contract=infiltratr-temporal-v3'             "$root/usr/share/infiltrator/policy-providers/temporal-v3"
          rm -rf "$root"
      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error
