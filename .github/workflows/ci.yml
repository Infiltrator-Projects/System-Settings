name: System Settings CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G DEB
      - name: Validate Debian integration assets
        if: runner.os == 'Linux'
        run: |
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          marker="$root/usr/share/infiltrator/policy-providers/temporal-v3"
          test -f "$marker"
          grep -qx 'provider=infiltrator-system-settings' "$marker"
          grep -qx 'policy-version=3' "$marker"
          grep -qx 'contract=infiltratr-temporal-v3' "$marker"
          desktop="$root/usr/share/applications/org.infiltrator.SystemSettings.desktop"
          icon="$root/usr/share/icons/hicolor/scalable/apps/org.infiltrator.SystemSettings.svg"
          test -f "$desktop"
          test -f "$icon"
          grep -qx 'Icon=org.infiltrator.SystemSettings' "$desktop"
          grep -q '#00ADEF' "$icon"
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq 'libgeocode-glib-2-0|libgeocode-glib0' <<<"$depends"
          rm -rf "$root"
      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error
