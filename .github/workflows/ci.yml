# SPDX-License-Identifier: GPL-3.0-or-later
name: System Settings CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux:
    name: Linux build, test and package
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release '))) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","linux-native","bigbedroom"]') }}
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out source and exact pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux UI dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Verify self-hosted Linux UI dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in tar cmake ctest cc pkg-config dpkg-deb git readelf sha256sum xvfb-run dbus-daemon; do
            command -v "$command_name" >/dev/null 2>&1 || { echo "Runner is missing $command_name." >&2; exit 1; }
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build reproducible Debian package
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          deb="$(find . -maxdepth 1 -type f -name 'infiltrator-system-settings_*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" "$RUNNER_TEMP/system-settings-first.deb"
          rm -f "$deb"
          cpack -G DEB
          deb="$(find . -maxdepth 1 -type f -name 'infiltrator-system-settings_*.deb' -print -quit)"
          cmp "$RUNNER_TEMP/system-settings-first.deb" "$deb"

      - name: Validate reproducible native release assets
        run: |
          set -euo pipefail
          rm -rf build/source-assets-check build/source-assets-check-2
          ./build/system-settings-source-asset-builder build/source-assets-check
          ./build/system-settings-source-asset-builder build/source-assets-check-2
          native="System-Settings-$(cat VERSION)-native.run"
          source="System-Settings-$(cat VERSION)-source.zip"
          test -s "build/source-assets-check/$native"
          test -s "build/source-assets-check/$source"
          cmp "build/source-assets-check/$native" "build/source-assets-check-2/$native"
          cmp "build/source-assets-check/$source" "build/source-assets-check-2/$source"
          "build/source-assets-check/$native" --build-only

      - name: Validate Debian integration assets
        run: |
          set -euo pipefail
          deb="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          root="$(mktemp -d)"
          dpkg-deb -x "$deb" "$root"
          marker="$root/usr/share/infiltrator/policy-providers/temporal-v3"
          test -f "$marker"
          grep -qx 'provider=infiltrator-system-settings' "$marker"
          grep -qx 'policy-version=3' "$marker"
          grep -qx 'contract=infiltratr-temporal-v3' "$marker"
          desktop="$root/usr/share/applications/org.infiltrator.SystemSettings.desktop"
          icon="$root/usr/share/icons/hicolor/scalable/apps/org.infiltrator.SystemSettings.svg"
          test -f "$desktop"
          test -f "$icon"
          grep -qx 'Icon=org.infiltrator.SystemSettings' "$desktop"
          grep -q '#00ADEF' "$icon"
          ui="$root/usr/share/infiltrator/system-settings/ui"
          binary="$root/usr/bin/system-settings"
          test -x "$binary"
          grep -aFq '/usr/share/infiltrator/system-settings/ui' "$binary"
          if grep -aFq '/usr/local/share/infiltrator/system-settings/ui' "$binary"; then
            echo "Packaged binary still contains the wrong /usr/local UI asset path." >&2
            exit 1
          fi
          for asset in hero-asset.png overview-asset.png date-asset.png region-asset.png network-asset.png theme-light.png theme-dark.png theme-follow.png; do
            test -s "$ui/$asset"
            cmp "assets/ui/$asset" "$ui/$asset"
          done
          depends="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq 'libgeocode-glib-2-0|libgeocode-glib0' <<<"$depends"
          rm -rf "$root"

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: infiltrator-system-settings-deb
          path: build/*.deb
          if-no-files-found: error

  windows:
    name: Windows build and test
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release '))) && '["windows-latest"]' || '["self-hosted","Windows","ARM64"]') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      PSExecutionPolicyPreference: RemoteSigned
    steps:
      - name: Discover Windows build tools and Git Bash
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $dirs = @((Join-Path $gitRoot 'bin'), (Join-Path $gitRoot 'usr\bin'), (Join-Path $env:ProgramFiles 'CMake\bin'))
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            if ($vs) { $dirs += Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin' }
          }
          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$dir;$env:PATH"
            }
          }
          Get-ExecutionPolicy -List
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: powershell
        run: |
          $jobs = [Math]::Max([Environment]::ProcessorCount - 1, 1)
          cmake --build build --config Release --parallel $jobs

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release '))) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","linux-native","bigbedroom"]') }}
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Check out source and exact pinned Common
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Linux UI dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Verify self-hosted sanitizer dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in tar cmake ctest cc pkg-config git readelf sha256sum xvfb-run dbus-daemon; do
            command -v "$command_name" >/dev/null 2>&1 || { echo "Runner is missing $command_name." >&2; exit 1; }
          done
          pkg-config --exists gtk4
          pkg-config --exists geocode-glib-2.0

      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON             -DSYSTEM_SETTINGS_WARNINGS_AS_ERRORS=ON             -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"             -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"             -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized targets
        run: cmake --build build-sanitized --parallel "$(($(nproc)>1?$(nproc)-1:1))"

      - name: Test non-GTK code with ASan, UBSan and leak detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure -E linux-shell

      - name: Test GTK shell with ASan, UBSan and leak detection
        env:
          # GTK/Pango/fontconfig retain a few documented process-global
          # caches. Suppress those exact external stacks instead of disabling
          # LeakSanitizer for the entire application shell.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure -R linux-shell
