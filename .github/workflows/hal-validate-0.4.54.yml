# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL validate 0.4.54

on:
  push:
    branches: ["hal/system-settings-forensic-0.4.54-clean"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/system-settings-forensic-0.4.54-clean
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSYSTEM_SETTINGS_BUILD_PROFILE=generic
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
