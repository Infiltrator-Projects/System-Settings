name: one-shot-brittleness-next3

on:
  push:
    branches:
      - fix/brittleness-next3

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply structural coupling cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_all(path, replacements):
              text = read(path)
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"{path}: missing replacement token {old!r}")
                  text = text.replace(old, new)
              write(path, text)

          # 1 + 2: make the panel's asynchronous lifetime explicit and make
          # each Date & Time sub-domain own its own widgets/async state.
          private_header = r'''// SPDX-License-Identifier: GPL-3.0-or-later
          #ifndef SYSTEM_SETTINGS_LINUX_DATE_TIME_PANEL_PRIVATE_H
          #define SYSTEM_SETTINGS_LINUX_DATE_TIME_PANEL_PRIVATE_H

          #include "linux-date-time-panel.h"
          #include "calendar-preview-provider.h"
          #include "policy-file-observer.h"

          #include "system-settings/date-time-model.h"
          #include "system-settings/location-metadata.h"
          #include "system-settings/regional-context.h"
          #include "system-settings/system-time-service.h"

          #include <gio/gio.h>
          #include <gtk/gtk.h>

          typedef struct SsLinuxDateTimeLifetime SsLinuxDateTimeLifetime;

          SsLinuxDateTimeLifetime *ss_linux_date_time_lifetime_new(
              SsLinuxDateTimePanel *panel);
          SsLinuxDateTimeLifetime *ss_linux_date_time_lifetime_ref(
              SsLinuxDateTimeLifetime *lifetime);
          void ss_linux_date_time_lifetime_invalidate(
              SsLinuxDateTimeLifetime *lifetime);
          void ss_linux_date_time_lifetime_unref(
              SsLinuxDateTimeLifetime *lifetime);
          SsLinuxDateTimePanel *ss_linux_date_time_lifetime_get_panel(
              SsLinuxDateTimeLifetime *lifetime);

          /*
           * Mutable state is grouped by the domain that owns it. The panel remains
           * the composition root, but locality code no longer shares flat widget or
           * protected-system-time fields with unrelated presentation concerns.
           */
          typedef struct SsLinuxDateTimeLocationState {
              GtkEntry *search_entry;
              GtkButton *search_button;
              GtkListBox *results;
              GtkWidget *summary;
              GtkSpinButton *latitude;
              GtkSpinButton *longitude;

              SsLocationMetadata metadata;
              SsPolicyFileObserver *metadata_observer;
              GCancellable *search_cancellable;
              guint coordinate_commit_id;
              guint recovery_retry_id;
              guint recovery_retry_seconds;
              guint search_generation;
              bool metadata_present;
              bool metadata_uncertain;
              bool follows_timezone_reference;
              bool recovery_failed;
          } SsLinuxDateTimeLocationState;

          typedef struct SsLinuxDateTimeSystemTimeState {
              GtkWidget *overview_timezone;
              GtkWidget *overview_sync;
              GtkDropDown *timezone;
              GtkSwitch *network_time;
              GtkEntry *manual_date;
              GtkEntry *manual_time;
              GtkButton *manual_set_time;
              GtkWidget *manual_row;
              GtkWidget *manual_unavailable;

              SsSystemTimeService *service;
              GPtrArray *timezone_ids;
              GCancellable *service_cancellable;
              GCancellable *timezone_cancellable;
              GCancellable *ntp_cancellable;
              GCancellable *manual_time_cancellable;
              guint timezone_generation;
              guint ntp_generation;
              guint manual_time_generation;
              bool updating_controls;
              bool manual_dirty;
          } SsLinuxDateTimeSystemTimeState;

          typedef struct SsLinuxDateTimePreviewState {
              GtkWidget *clock_label;
              GtkWidget *date_label;
              GtkWidget *overview_clock;
              GtkWidget *overview_calendar;

              SsCalendarPreviewProvider *calendar_provider;
              guint timer_id;
              guint idle_id;
              gint date_year;
              gint date_month;
              gint date_day;
              gchar *date_calendar;
              bool date_cache_valid;
          } SsLinuxDateTimePreviewState;

          struct SsLinuxDateTimePanel {
              GtkWindow *window;
              GtkWidget *root;
              GtkDropDown *clock_mode;
              GtkDropDown *calendar;
              GtkSwitch *show_seconds;
              GtkSwitch *show_date;
              GtkDropDown *first_day;
              GtkWidget *status_label;

              GSettings *cinnamon_interface_settings;
              SsDateTimeModel model;
              SsRegionalContext regional_context;
              SsPolicyFileObserver *policy_observer;
              GPtrArray *clock_mode_ids;
              SsLinuxDateTimeLifetime *lifetime;

              SsLinuxDateTimeLocationState location;
              SsLinuxDateTimeSystemTimeState system_time;
              SsLinuxDateTimePreviewState preview;

              bool updating_controls;
          };

          GtkWidget *ss_linux_date_time_panel_build_ui(
              SsLinuxDateTimePanel *state);

          /* Internal controller services shared by split Date & Time translation units. */
          void ss_linux_date_time_panel_set_status(
              SsLinuxDateTimePanel *state,
              const char *message,
              bool error);
          void ss_linux_date_time_panel_sync_controls(
              SsLinuxDateTimePanel *state);
          void ss_linux_date_time_panel_policy_saved(
              SsLinuxDateTimePanel *state);
          guint ss_linux_date_time_panel_preview_interval_ms(
              const SsLinuxDateTimePanel *state);

          bool ss_linux_date_time_location_coordinate_close(
              double left,
              double right);
          bool ss_linux_date_time_location_metadata_matches_policy(
              const SsLinuxDateTimePanel *state,
              const InfiltratrTemporalPolicyV3 *policy);
          bool ss_linux_date_time_location_policy_matches_reference(
              const SsLinuxDateTimePanel *state);
          void ss_linux_date_time_location_update_summary(
              SsLinuxDateTimePanel *state);
          void ss_linux_date_time_location_cancel_coordinate_commit(
              SsLinuxDateTimePanel *state);

          void on_clock_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_calendar_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_seconds_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_timezone_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_network_time_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_manual_set_time_clicked(GtkButton *button, gpointer user_data);
          void on_manual_entry_changed(GtkEditable *editable, gpointer user_data);
          void on_show_date_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_first_day_changed(GObject *object, GParamSpec *pspec, gpointer user_data);
          void on_location_result_activated(
              GtkListBox *box, GtkListBoxRow *row, gpointer user_data);
          void on_location_search_clicked(GtkButton *button, gpointer user_data);
          void on_location_search_activate(GtkEntry *entry, gpointer user_data);
          void on_location_coordinate_changed(
              GObject *object, GParamSpec *pspec, gpointer user_data);

          #endif
          '''
          # Strip the workflow heredoc's indentation while retaining source layout.
          import textwrap
          write("src/modules/date-time/linux-date-time-panel-private.h",
                textwrap.dedent(private_header))

          ownership_replacements = [
              ("state->location_search_button", "state->location.search_button"),
              ("state->location_search", "state->location.search_entry"),
              ("state->location_results", "state->location.results"),
              ("state->location_summary", "state->location.summary"),
              ("state->latitude", "state->location.latitude"),
              ("state->longitude", "state->location.longitude"),
              ("state->clock_preview", "state->preview.clock_label"),
              ("state->date_preview", "state->preview.date_label"),
              ("state->overview_clock", "state->preview.overview_clock"),
              ("state->overview_calendar", "state->preview.overview_calendar"),
              ("state->overview_timezone", "state->system_time.overview_timezone"),
              ("state->overview_sync", "state->system_time.overview_sync"),
              ("state->manual_set_time", "state->system_time.manual_set_time"),
              ("state->manual_unavailable", "state->system_time.manual_unavailable"),
              ("state->manual_date", "state->system_time.manual_date"),
              ("state->manual_time", "state->system_time.manual_time"),
              ("state->manual_row", "state->system_time.manual_row"),
              ("state->network_time", "state->system_time.network_time"),
              ("state->timezone", "state->system_time.timezone"),
              ("state->updating_system_controls", "state->system_time.updating_controls"),
              ("state->manual_dirty", "state->system_time.manual_dirty"),
              ("state->location.timezone_ids", "state->system_time.timezone_ids"),
              ("state->location.timezone_cancellable", "state->system_time.timezone_cancellable"),
              ("state->location.timezone_generation", "state->system_time.timezone_generation"),
          ]
          for source in (
              "src/modules/date-time/linux-date-time-panel.c",
              "src/modules/date-time/linux-date-time-location.c",
              "src/modules/date-time/linux-date-time-panel-ui.c",
          ):
              replace_all(source, ownership_replacements)

          panel_path = "src/modules/date-time/linux-date-time-panel.c"
          panel = read(panel_path)
          panel = replace_once(
              panel,
              '''typedef struct SystemTimeUiRequest {\n    GtkWindow *window;\n    guint generation;\n    SsSystemTimeOperation operation;\n} SystemTimeUiRequest;\n''',
              '''typedef struct SystemTimeUiRequest {\n    SsLinuxDateTimeLifetime *lifetime;\n    guint generation;\n    SsSystemTimeOperation operation;\n} SystemTimeUiRequest;\n\nstruct SsLinuxDateTimeLifetime {\n    gint references;\n    gpointer panel;\n};\n\nSsLinuxDateTimeLifetime *ss_linux_date_time_lifetime_new(\n    SsLinuxDateTimePanel *panel)\n{\n    SsLinuxDateTimeLifetime *lifetime =\n        g_new0(SsLinuxDateTimeLifetime, 1);\n\n    lifetime->references = 1;\n    g_atomic_pointer_set(&lifetime->panel, panel);\n    return lifetime;\n}\n\nSsLinuxDateTimeLifetime *ss_linux_date_time_lifetime_ref(\n    SsLinuxDateTimeLifetime *lifetime)\n{\n    if (lifetime != NULL) {\n        g_atomic_int_inc(&lifetime->references);\n    }\n    return lifetime;\n}\n\nvoid ss_linux_date_time_lifetime_invalidate(\n    SsLinuxDateTimeLifetime *lifetime)\n{\n    if (lifetime != NULL) {\n        g_atomic_pointer_set(&lifetime->panel, NULL);\n    }\n}\n\nvoid ss_linux_date_time_lifetime_unref(\n    SsLinuxDateTimeLifetime *lifetime)\n{\n    if (lifetime != NULL &&\n        g_atomic_int_dec_and_test(&lifetime->references)) {\n        g_free(lifetime);\n    }\n}\n\nSsLinuxDateTimePanel *ss_linux_date_time_lifetime_get_panel(\n    SsLinuxDateTimeLifetime *lifetime)\n{\n    return lifetime != NULL\n        ? g_atomic_pointer_get(&lifetime->panel)\n        : NULL;\n}\n''',
              "system-time request/lifetime anchor")

          panel = replace_once(
              panel,
              '''    g_clear_object(&request->window);\n    g_free(request);\n''',
              '''    ss_linux_date_time_lifetime_unref(request->lifetime);\n    g_free(request);\n''',
              "system-time request release")
          panel = replace_once(
              panel,
              '''    request = g_new0(SystemTimeUiRequest, 1);\n    request->window = g_object_ref(state->window);\n    request->generation = *generation;\n''',
              '''    request = g_new0(SystemTimeUiRequest, 1);\n    request->lifetime =\n        ss_linux_date_time_lifetime_ref(state->lifetime);\n    request->generation = *generation;\n''',
              "system-time request acquire")
          panel = replace_once(
              panel,
              '''    SystemTimeUiRequest *request = user_data;\n    SsLinuxDateTimePanel *state = NULL;\n\n    if (request != NULL && request->window != NULL) {\n        state = g_object_get_data(\n            G_OBJECT(request->window),\n            "system-settings-date-time-panel");\n    }\n''',
              '''    SystemTimeUiRequest *request = user_data;\n    SsLinuxDateTimePanel *state = request != NULL\n        ? ss_linux_date_time_lifetime_get_panel(request->lifetime)\n        : NULL;\n''',
              "system-time completion lookup")

          old_ready_start = '''static void system_time_service_ready(\n    SsSystemTimeService *service,\n    const char *error_message,\n    gpointer user_data)\n{\n    GtkWindow *window = GTK_WINDOW(user_data);\n    SsLinuxDateTimePanel *state = g_object_get_data(\n        G_OBJECT(window), "system-settings-date-time-panel");\n\n    if (state == NULL) {\n        ss_system_time_service_free(service);\n        g_object_unref(window);\n        return;\n    }\n'''
          new_ready_start = '''static void system_time_service_ready(\n    SsSystemTimeService *service,\n    const char *error_message,\n    gpointer user_data)\n{\n    SsLinuxDateTimeLifetime *lifetime = user_data;\n    SsLinuxDateTimePanel *state =\n        ss_linux_date_time_lifetime_get_panel(lifetime);\n\n    if (state == NULL) {\n        ss_system_time_service_free(service);\n        ss_linux_date_time_lifetime_unref(lifetime);\n        return;\n    }\n'''
          panel = replace_once(panel, old_ready_start, new_ready_start,
                               "system service ready lookup")
          ready_begin = panel.index("static void system_time_service_ready(")
          ready_end = panel.index("\nstatic bool migrate_legacy_native_clock", ready_begin)
          ready = panel[ready_begin:ready_end]
          if "g_object_unref(window);" not in ready:
              raise SystemExit("system service ready: expected window releases")
          ready = ready.replace(
              "g_object_unref(window);",
              "ss_linux_date_time_lifetime_unref(lifetime);")
          panel = panel[:ready_begin] + ready + panel[ready_end:]

          panel = replace_once(
              panel,
              '''    ss_system_time_service_new_async(\n        state->system_time.service_cancellable,\n        system_time_service_ready,\n        g_object_ref(state->window));\n''',
              '''    state->lifetime = ss_linux_date_time_lifetime_new(state);\n    ss_system_time_service_new_async(\n        state->system_time.service_cancellable,\n        system_time_service_ready,\n        ss_linux_date_time_lifetime_ref(state->lifetime));\n''',
              "system service async anchor")
          panel = replace_once(
              panel,
              '''    if (state == NULL) {\n        return;\n    }\n\n    stop_preview_timer(state);\n''',
              '''    if (state == NULL) {\n        return;\n    }\n\n    /* Make every outstanding async completion inert before cancellation. */\n    ss_linux_date_time_lifetime_invalidate(state->lifetime);\n\n    stop_preview_timer(state);\n''',
              "panel lifetime invalidation")
          panel = replace_once(
              panel,
              '''    if (state->root != NULL) {\n        disconnect_panel_widgets(state->root, state);\n        g_clear_object(&state->root);\n    }\n    g_free(state);\n}\n''',
              '''    if (state->root != NULL) {\n        disconnect_panel_widgets(state->root, state);\n        g_clear_object(&state->root);\n    }\n    ss_linux_date_time_lifetime_unref(state->lifetime);\n    state->lifetime = NULL;\n    g_free(state);\n}\n''',
              "panel lifetime release")
          write(panel_path, panel)

          location_path = "src/modules/date-time/linux-date-time-location.c"
          location = read(location_path)
          location = replace_once(
              location,
              '''typedef struct LocationSearchUiRequest {\n    GtkWindow *window;\n    guint generation;\n} LocationSearchUiRequest;\n''',
              '''typedef struct LocationSearchUiRequest {\n    SsLinuxDateTimeLifetime *lifetime;\n    guint generation;\n} LocationSearchUiRequest;\n''',
              "location request anchor")
          location = replace_once(
              location,
              '''    g_clear_object(&request->window);\n    g_free(request);\n''',
              '''    ss_linux_date_time_lifetime_unref(request->lifetime);\n    g_free(request);\n''',
              "location request release")
          location = replace_once(
              location,
              '''    if (request == NULL || request->window == NULL) {\n        if (results != NULL) {\n            g_ptr_array_unref(results);\n        }\n        location_search_request_free(request);\n        return;\n    }\n\n    state = g_object_get_data(\n        G_OBJECT(request->window),\n        "system-settings-date-time-panel");\n''',
              '''    if (request == NULL || request->lifetime == NULL) {\n        if (results != NULL) {\n            g_ptr_array_unref(results);\n        }\n        location_search_request_free(request);\n        return;\n    }\n\n    state = ss_linux_date_time_lifetime_get_panel(request->lifetime);\n''',
              "location completion lookup")
          location = replace_once(
              location,
              '''        request->window = g_object_ref(state->window);\n        request->generation = state->location.search_generation;\n''',
              '''        request->lifetime =\n            ss_linux_date_time_lifetime_ref(state->lifetime);\n        request->generation = state->location.search_generation;\n''',
              "location request acquire")
          write(location_path, location)

          host_path = "src/app/linux-builtin-module-host.c"
          host = read(host_path)
          host = replace_once(
              host,
              '''    const char *page_id;\n    const char *window_data_key;\n    SsBuiltinModuleCreateFunc create;\n''',
              '''    const char *page_id;\n    SsBuiltinModuleCreateFunc create;\n''',
              "host descriptor")
          host = replace_once(
              host,
              '''        .page_id = "date-time",\n        .window_data_key = "system-settings-date-time-panel",\n        .create = create_date_time_module,\n''',
              '''        .page_id = "date-time",\n        .create = create_date_time_module,\n''',
              "host date-time descriptor")
          free_start = host.index("void ss_builtin_module_host_free(")
          ensure_start = host.index("\nbool ss_builtin_module_host_ensure_page(", free_start)
          host = host[:free_start] + '''void ss_builtin_module_host_free(SsBuiltinModuleHost *host)\n{\n    if (host == NULL) {\n        return;\n    }\n\n    /*\n     * Async module work owns explicit lifetime anchors. The host therefore\n     * tears modules down directly and does not publish controller pointers\n     * through GtkWindow object-data side channels.\n     */\n    g_clear_pointer(&host->instances, g_hash_table_unref);\n    g_free(host);\n}\n''' + host[ensure_start:]
          host = replace_once(
              host,
              '''\n        if (descriptor->window_data_key != NULL) {\n            g_object_set_data(\n                G_OBJECT(host->window),\n                descriptor->window_data_key,\n                controller);\n        }\n''',
              '''\n''',
              "host window-data publication")
          write(host_path, host)

          # 3: generic module pages have exactly one registry/container/load path.
          shell_private = r'''// SPDX-License-Identifier: GPL-3.0-or-later
          #ifndef SYSTEM_SETTINGS_SHELL_WINDOW_PRIVATE_H
          #define SYSTEM_SETTINGS_SHELL_WINDOW_PRIVATE_H

          #include "builtin-module-host.h"
          #include "shell-window.h"

          #include <gtk/gtk.h>
          #include <stdbool.h>

          typedef struct ShellModulePage {
              gchar *page_id;
              gchar *title;
              GtkListBoxRow *row;
              GtkScrolledWindow *container;
          } ShellModulePage;

          typedef struct ShellSearchState {
              GtkListBox *list;
              GtkWindow *parent;
              GtkStack *stack;
              GtkListBoxRow *home_row;
              SsBuiltinModuleHost *module_host;
              GHashTable *module_pages;
              gchar *query;
          } ShellSearchState;

          gboolean navigation_filter(GtkListBoxRow *row, gpointer user_data);
          void on_search_changed(GtkSearchEntry *entry, gpointer user_data);
          bool shell_open_page(ShellSearchState *state, const char *page_id);

          #endif
          '''
          write("src/shell/linux/shell-window-private.h",
                textwrap.dedent(shell_private))

          shell_path = "src/shell/linux/shell-window.c"
          shell = read(shell_path)
          shell = replace_once(
              shell,
              '''    g_hash_table_replace(\n        state->module_pages,\n        g_strdup(page_id),\n        page);\n\n    if (g_strcmp0(page_id, state->home_primary_page_id) == 0) {\n        state->primary_module_row = row;\n    }\n''',
              '''    g_hash_table_replace(\n        state->module_pages,\n        g_strdup(page_id),\n        page);\n''',
              "generic module registration")
          shell = replace_once(
              shell,
              '''    page->container = container;\n    if (g_strcmp0(page_id, state->home_primary_page_id) == 0) {\n        state->primary_module_container = container;\n    }\n''',
              '''    page->container = container;\n''',
              "generic module container")
          shell = replace_once(
              shell,
              '''    if (ss_builtin_module_host_is_loaded(state->module_host, page_id)) {\n        if (g_strcmp0(page_id, state->home_primary_page_id) == 0) {\n            state->primary_module_loaded = true;\n        }\n        return true;\n    }\n''',
              '''    if (ss_builtin_module_host_is_loaded(state->module_host, page_id)) {\n        return true;\n    }\n''',
              "generic loaded path")
          shell = replace_once(
              shell,
              '''    if (!ss_builtin_module_host_ensure_page(\n            state->module_host,\n            page_id,\n            page->container,\n            &panel_error)) {\n        if (g_strcmp0(page_id, state->home_primary_page_id) == 0) {\n            state->primary_module_loaded = false;\n        }\n        gtk_scrolled_window_set_child(\n''',
              '''    if (!ss_builtin_module_host_ensure_page(\n            state->module_host,\n            page_id,\n            page->container,\n            &panel_error)) {\n        gtk_scrolled_window_set_child(\n''',
              "generic module failure path")
          shell = replace_once(
              shell,
              '''\n    if (g_strcmp0(page_id, state->home_primary_page_id) == 0) {\n        state->primary_module_loaded = true;\n    }\n    return true;\n}\n''',
              '''\n    return true;\n}\n''',
              "generic module success path")
          shell = replace_once(
              shell,
              '''static void open_home_primary_page(gpointer user_data)\n{\n    ShellSearchState *state = user_data;\n\n    if (state == NULL || state->home_primary_page_id == NULL) {\n        return;\n    }\n    (void)shell_open_page(state, state->home_primary_page_id);\n}\n''',
              '''static void open_home_primary_page(gpointer user_data)\n{\n    ShellSearchState *state = user_data;\n\n    if (state != NULL) {\n        (void)shell_open_page(state, SS_DATE_TIME_PAGE_ID);\n    }\n}\n''',
              "home shortcut without shell module state")
          shell = replace_once(
              shell,
              '''    search_state = g_new0(ShellSearchState, 1);\n    search_state->module_host = module_host;\n    search_state->home_primary_page_id = SS_DATE_TIME_PAGE_ID;\n    search_state->module_pages = g_hash_table_new_full(\n''',
              '''    search_state = g_new0(ShellSearchState, 1);\n    search_state->module_host = module_host;\n    search_state->module_pages = g_hash_table_new_full(\n''',
              "shell state setup")
          shell = replace_once(
              shell,
              '''    if (state != NULL) {\n        state->module_host = NULL;\n        state->primary_module_loaded = false;\n    }\n''',
              '''    if (state != NULL) {\n        state->module_host = NULL;\n    }\n''',
              "shell close state")
          write(shell_path, shell)

          # Documentation must describe the actual lifetime boundary.
          architecture_path = "docs/ARCHITECTURE.md"
          architecture = read(architecture_path)
          architecture = replace_once(
              architecture,
              '''Pending UI requests retain a window reference, look up the panel again and\ncheck their generation before touching it. A removed panel means the reply is\nignored; cancellation alone is not a lifetime guarantee.\n''',
              '''Pending UI requests retain a small ref-counted lifetime anchor rather than a\nwindow/controller side channel. Panel teardown invalidates that anchor before\ncancelling work; completions resolve the panel through the anchor and then check\ntheir operation generation before touching state. A removed panel therefore\nmakes every late reply inert; cancellation alone is not treated as a lifetime\nguarantee.\n''',
              "architecture async lifetime")
          write(architecture_path, architecture)

          # The magic cross-component lookup must be gone completely.
          for path in (
              "src/app/linux-builtin-module-host.c",
              "src/modules/date-time/linux-date-time-panel.c",
              "src/modules/date-time/linux-date-time-location.c",
          ):
              text = read(path)
              if "system-settings-date-time-panel" in text:
                  raise SystemExit(f"{path}: stale window-data lifecycle key remains")

          # The generic shell must not regain parallel first-module bookkeeping.
          shell = read(shell_path)
          for token in (
              "home_primary_page_id",
              "primary_module_row",
              "primary_module_container",
              "primary_module_loaded",
          ):
              if token in shell:
                  raise SystemExit(f"{shell_path}: stale special-case field {token}")

          # Remove this one-shot mechanism from the resulting branch.
          Path(".github/workflows/refactor-brittleness-next3.yml").unlink()
          PY

          git diff --check
          git status --short

      - name: Commit refactor
