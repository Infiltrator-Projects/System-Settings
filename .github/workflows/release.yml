# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_run:
    workflows: ["System Settings CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-4-dev libgeocode-glib-dev pkg-config xvfb dbus-x11

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.workflow_run.head_sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$expected"
          version="$(cat VERSION)"
          subject="$(git log -1 --format=%s)"
          [[ "$subject" == "Release $version"* ]]

      - name: Build and test package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DSYSTEM_SETTINGS_BUILD_PROFILE=generic
          cmake --build build --parallel "$(($(nproc)>1?$(nproc)-1:1))"
          ctest --test-dir build --output-on-failure
          cd build
          cpack -G DEB

      - name: Build native installer and complete source archive
        run: ./build/system-settings-source-asset-builder build

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          sha="$(git rev-parse HEAD)"
          deb="$(find build -maxdepth 1 -type f -name 'infiltrator-system-settings_*.deb' -print -quit)"
          test -n "$deb"
          test -s "$deb"
          native="build/System-Settings-$version-native.run"
          source="build/System-Settings-$version-source.zip"
          test -s "$native"
          test -s "$source"
          (cd build && sha256sum "$(basename "$deb")" "$(basename "$native")" "$(basename "$source")" > SHA256SUMS)

          existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$existing" && "$existing" != "$sha" ]]; then
            echo "Tag $tag already points to another commit." >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$sha"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; verifying the exact immutable asset set."
            verify="$(mktemp -d)"
            trap 'rm -rf "$verify"' EXIT
            expected_names="$(
              printf '%s\n' \
                "$(basename "$deb")" \
                "$(basename "$native")" \
                "$(basename "$source")" \
                "SHA256SUMS" | sort
            )"
            actual_names="$(
              gh release view "$tag" --json assets --jq '.assets[].name' | sort
            )"
            test "$actual_names" = "$expected_names"
            gh release download "$tag" --dir "$verify"
            for asset in "$deb" "$native" "$source" build/SHA256SUMS; do
              name="$(basename "$asset")"
              test -s "$verify/$name"
              cmp "$asset" "$verify/$name"
            done
            (cd "$verify" && sha256sum -c SHA256SUMS)
          else
            gh release create "$tag" "$deb" "$native" "$source" build/SHA256SUMS \
              --verify-tag \
              --target "$sha" \
              --title "System Settings $version" \
              --notes "See CHANGELOG.md for the complete user-visible and architectural changes in System Settings $version."
          fi
