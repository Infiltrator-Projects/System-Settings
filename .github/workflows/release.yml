# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_run:
    workflows: ["System Settings CI"]
    types: [completed]

# CI remains read-only. This workflow is the narrow promotion boundary that is
# allowed to publish a GitHub release after the exact main-branch CI run passes.
permissions:
  contents: read
  actions: read

# Never let two promotion attempts race while creating or repairing a tag/release.
concurrency:
  group: system-settings-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Classify release candidate
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.workflow_run.head_sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          candidate=true

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          if [[ "$current_main" != "$expected" ]]; then
            candidate=false
            echo "Ignoring stale successful CI run $expected; main is now $current_main."
          else
            existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$existing" && "$existing" != "$expected" ]]; then
              candidate=false
              echo "VERSION $version is already owned by $existing; this main commit is not a release candidate."
            fi
          fi

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Download exact CI-tested release bytes
        if: steps.classify.outputs.candidate == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: system-settings-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release bundle
        if: steps.classify.outputs.candidate == 'true'
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          mapfile -t debs < <(find release-assets -maxdepth 1 -type f \
            -name "infiltrator-system-settings_${version}_*.deb" -print)
          [[ ${#debs[@]} -eq 1 ]]
          deb="${debs[0]}"
          native="release-assets/System-Settings-${version}-native.run"
          source="release-assets/System-Settings-${version}-source.zip"

          test -s "$deb"
          test -s "$native"
          test -s "$source"
          [[ "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3 ]]
          test "$(dpkg-deb -f "$deb" Package)" = "infiltrator-system-settings"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          chmod +x "$native"
          (cd release-assets && sha256sum \
            "$(basename "$deb")" \
            "$(basename "$native")" \
            "$(basename "$source")" > SHA256SUMS)

          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Publish or repair release
        if: steps.classify.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          tag="${{ steps.classify.outputs.tag }}"
          sha="${{ steps.classify.outputs.sha }}"
          deb="${{ steps.bundle.outputs.deb }}"
          native="${{ steps.bundle.outputs.native }}"
          source="${{ steps.bundle.outputs.source }}"

          tag_target="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$tag_target" && "$tag_target" != "$sha" ]]; then
            echo "Tag $tag already points to $tag_target, not tested commit $sha." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # A retry after a partial upload repairs the release from the same
            # immutable CI artifact bundle rather than rebuilding anything.
            gh release upload "$tag" \
              "$deb" "$native" "$source" release-assets/SHA256SUMS \
              --clobber
          else
            # gh creates the lightweight tag at --target when it does not yet
            # exist, avoiding the old tag-first/release-second failure window.
            gh release create "$tag" \
              "$deb" "$native" "$source" release-assets/SHA256SUMS \
              --target "$sha" \
              --title "System Settings $version" \
              --generate-notes
          fi

          expected_names="$(printf '%s\n' \
            "$(basename "$deb")" \
            "$(basename "$native")" \
            "$(basename "$source")" \
            "SHA256SUMS" | sort)"
          actual_names="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          test "$actual_names" = "$expected_names"

          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT
          gh release download "$tag" --dir "$verify"
          for asset in "$deb" "$native" "$source" release-assets/SHA256SUMS; do
            cmp "$asset" "$verify/$(basename "$asset")"
          done
          (cd "$verify" && sha256sum -c SHA256SUMS)

# APT publication deliberately does not live here. Infiltrator-Repository is
# the authority that discovers verified GitHub releases and publishes its own
# catalogue; keeping that cross-repository concern out of this workflow avoids
# polling, cross-repository tokens and false producer failures.
