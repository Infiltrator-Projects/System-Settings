# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_run:
    workflows: ["System Settings CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      release_candidate: ${{ steps.classify.outputs.candidate }}
      release_version: ${{ steps.classify.outputs.version }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Classify release from VERSION
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.workflow_run.head_sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$expected"

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"

          candidate=true
          if [[ -n "$existing" && "$existing" != "$expected" ]]; then
            candidate=false
            echo "VERSION $version is already released from $existing; this is a normal post-release main commit."
          fi

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Download exact CI-tested release bytes
        if: steps.classify.outputs.candidate == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: system-settings-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release artifact identity
        if: steps.classify.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          deb="release-assets/infiltrator-system-settings_${version}_amd64.deb"
          native="release-assets/System-Settings-${version}-native.run"
          source="release-assets/System-Settings-${version}-source.zip"

          test -s "$deb"
          test -s "$native"
          test -s "$source"
          test "$(dpkg-deb -f "$deb" Package)" = "infiltrator-system-settings"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          chmod +x "$native"
          (cd release-assets && sha256sum \
            "$(basename "$deb")" \
            "$(basename "$native")" \
            "$(basename "$source")" > SHA256SUMS)

      - name: Publish or verify release
        if: steps.classify.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          tag="${{ steps.classify.outputs.tag }}"
          sha="${{ steps.classify.outputs.sha }}"
          deb="release-assets/infiltrator-system-settings_${version}_amd64.deb"
          native="release-assets/System-Settings-${version}-native.run"
          source="release-assets/System-Settings-${version}-source.zip"

          existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$existing" && "$existing" != "$sha" ]]; then
            echo "Tag $tag already points to another commit." >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$sha"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            verify="$(mktemp -d)"
            trap 'rm -rf "$verify"' EXIT
            expected_names="$(printf '%s\n' \
              "$(basename "$deb")" \
              "$(basename "$native")" \
              "$(basename "$source")" \
              "SHA256SUMS" | sort)"
            actual_names="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
            test "$actual_names" = "$expected_names"
            gh release download "$tag" --dir "$verify"
            for asset in "$deb" "$native" "$source" release-assets/SHA256SUMS; do
              cmp "$asset" "$verify/$(basename "$asset")"
            done
            (cd "$verify" && sha256sum -c SHA256SUMS)
          else
            gh release create "$tag" "$deb" "$native" "$source" release-assets/SHA256SUMS \
              --verify-tag \
              --target "$sha" \
              --title "System Settings $version" \
              --generate-notes
          fi

      - name: Keep only main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -Ev '^(HEAD|main)$' || true
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch"
          done
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$'
          )
          (( ${#remaining[@]} == 1 ))
          [[ "${remaining[0]}" == "main" ]]

  apt-publication:
    name: Observe central APT publication
    needs: publish
    if: needs.publish.outputs.release_candidate == 'true'
    continue-on-error: true
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for central catalogue
        env:
          VERSION: ${{ needs.publish.outputs.release_version }}
          APP_ID: system-settings
        shell: bash
        run: |
          set -euo pipefail
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 0 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?version=$VERSION&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
