# SPDX-License-Identifier: GPL-3.0-or-later
name: publish-release

on:
  workflow_run:
    workflows: ["System Settings CI"]
    types: [completed]

# CI remains read-only. This workflow is the narrow promotion boundary that is
# allowed to publish a GitHub release after the exact main-branch CI run passes.
permissions:
  contents: read
  actions: read

# Never let two promotion attempts race while creating or repairing a tag/release.
concurrency:
  group: system-settings-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Classify release candidate
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.workflow_run.head_sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          candidate=true

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          if [[ "$current_main" != "$expected" ]]; then
            candidate=false
            echo "Ignoring stale successful CI run $expected; main is now $current_main."
          else
            existing="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$existing" && "$existing" != "$expected" ]]; then
              candidate=false
              echo "VERSION $version is already owned by $existing; this main commit is not a release candidate."
            fi
          fi

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Download exact CI-tested release bytes
        if: steps.classify.outputs.candidate == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: system-settings-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Seal exact tested bundle for publication
        if: steps.classify.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tested_assets < <(
            find release-assets -maxdepth 1 -type f -print | sort
          )
          if [[ ${#tested_assets[@]} -eq 0 ]]; then
            echo "CI release bundle is empty." >&2
            exit 1
          fi
          for asset in "${tested_assets[@]}"; do
            test -s "$asset"
          done

          # CI owns the release-asset contract. Promotion deliberately does not
          # reconstruct package names or asset counts; it seals exactly the
          # already-tested bytes and publishes that opaque bundle plus checksums.
          (
            cd release-assets
            rm -f SHA256SUMS
            mapfile -t names < <(
              find . -maxdepth 1 -type f -printf '%f\n' | sort
            )
            if [[ ${#names[@]} -eq 0 ]]; then
              echo "CI release bundle contained no publishable files." >&2
              exit 1
            fi
            sha256sum "${names[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish or repair release
        if: steps.classify.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.classify.outputs.version }}"
          tag="${{ steps.classify.outputs.tag }}"
          sha="${{ steps.classify.outputs.sha }}"

          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f -print | sort
          )
          test -s release-assets/SHA256SUMS
          [[ ${#assets[@]} -ge 2 ]]

          tag_target="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$tag_target" && "$tag_target" != "$sha" ]]; then
            echo "Tag $tag already points to $tag_target, not tested commit $sha." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # A retry after a partial upload repairs the release from the same
            # immutable CI artifact bundle rather than rebuilding anything.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            # gh creates the lightweight tag at --target when it does not yet
            # exist, avoiding the old tag-first/release-second failure window.
            gh release create "$tag" "${assets[@]}" \
              --target "$sha" \
              --title "System Settings $version" \
              --generate-notes
          fi

          expected_names="$(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          )"
          actual_names="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          test "$actual_names" = "$expected_names"

          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT
          gh release download "$tag" --dir "$verify"
          for asset in "${assets[@]}"; do
            cmp "$asset" "$verify/$(basename "$asset")"
          done
          (cd "$verify" && sha256sum -c SHA256SUMS)

# APT publication deliberately does not live here. Infiltrator-Repository is
# the authority that discovers verified GitHub releases and publishes its own
# catalogue; keeping that cross-repository concern out of this workflow avoids
# polling, cross-repository tokens and false producer failures.
