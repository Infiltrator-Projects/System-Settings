name: Temporary 0.4.52 test maintenance

on:
  push:
    branches:
      - hal/system-settings-forensic-0.4.52

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update current appearance contract regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/linux-shell-test.c')
          s = p.read_text()
          old = '''             * states. The four appearance previews, however, are always a\n             * compact horizontal strip and must never regress to a vertical\n             * thumbnail column.\n'''
          new = '''             * states. The three canonical System/Day/Night previews are a\n             * compact horizontal strip on the desktop layout and must never\n             * regress to stale fourth-theme content.\n'''
          if s.count(old) != 1:
              raise SystemExit('appearance regression comment not found exactly once')
          s = s.replace(old, new, 1)
          if s.count('g_assert_cmpuint(preview_count, ==, 4U);') != 1:
              raise SystemExit('appearance preview count assertion not found exactly once')
          s = s.replace('g_assert_cmpuint(preview_count, ==, 4U);',
                        'g_assert_cmpuint(preview_count, ==, 3U);', 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-0.4.52-test.yml
      - name: Commit product test update
        run: |
          git config user.name "HAL System Settings Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align shell regression with System Day Night previews"
          git push origin HEAD:hal/system-settings-forensic-0.4.52
