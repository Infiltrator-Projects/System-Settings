name: Apply remaining brittleness refactor

on:
  push:
    branches:
      - fix/remaining-brittleness-2026-10-12

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'Apply remaining brittleness refactor output') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/remaining-brittleness-2026-10-12
          fetch-depth: 0

      - name: Preserve separators between extracted C functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/refactor_remaining_brittleness.py')
          text = path.read_text(encoding='utf-8')
          old = '''        end = _matching_brace(text, brace) + 1\n        start = match.start()\n        while start > 0 and text[start - 1] == "\\n":\n            start -= 1\n            if start > 0 and text[start - 1] != "\\n":\n                break\n        while end < len(text) and text[end] == "\\n":\n            end += 1\n        return start, end\n'''
          new = '''        end = _matching_brace(text, brace) + 1\n        start = match.start()\n        return start, end\n'''
          if text.count(old) != 1:
              raise SystemExit('function-span separator patch did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic structural refactor
        run: python3 tools/refactor_remaining_brittleness.py

      - name: Validate patch shape
        run: |
          set -euo pipefail
          git diff --check
          test -f src/modules/date-time/linux-date-time-preview.c
          test -f src/modules/date-time/linux-date-time-preview-boundary.c
          test -f src/shell/linux/home-status.c
          test -f src/shell/linux/shell-module-catalog.c

      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt docs/ARCHITECTURE.md src/modules/date-time src/shell/linux
          git commit -m "Apply remaining brittleness refactor output"
          git push origin HEAD:fix/remaining-brittleness-2026-10-12
