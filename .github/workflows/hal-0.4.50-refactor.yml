name: HAL 0.4.50 refactor

on:
  push:
    branches:
      - "hal/0.4.50-responsiveness-ui-common"

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "hal/0.4.50-responsiveness-ui-common"
          fetch-depth: 0
      - name: Apply bounded source changes
        run: python3 .github/hal-0.4.50-refactor.py
      - name: Commit source changes
        run: |
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --check --cached
          git commit -m "Optimize System Settings responsiveness and shell styling"
          git push origin HEAD:hal/0.4.50-responsiveness-ui-common
